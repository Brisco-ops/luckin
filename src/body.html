function tr(t){const k=t.trim();if(!k)return t;let v=EN.get(k);
  if(v==null)for(const [rx,f] of EN_RX){const m=k.match(rx);if(m){v=f(...m);break}}

function lastWeightAvg(ref=TODAY()){const s=weightSeries().filter(p=>p.d<=ref&&p.d>addDays(ref,-7));return avg(s.map(p=>p.v))}
function lastPerf(name,excludeId){for(let i=db.workouts.length-1;i>=0;i--){const w=db.workouts[i];if(w.id===excludeId||!w.end||w.kind!=='muscu')continue;const e=w.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e&&e.logged.length)return {date:w.date,sets:e.logged}}return null}
function timedSecs(e){const m=String(e?.reps||'').trim().match(/^(\d+(?:[.,]\d+)?)\s*(s|sec|secondes?|min|mn)\b/i);if(!m)return null;const n=num(m[1]);return /^m/i.test(m[2])?Math.round(n*60):Math.round(n)}
const setTxt=s=>s.secs!=null?`${s.secs} s${s.load?' · '+fmt(s.load)+' kg':''}`:`${s.load!=null?fmt(s.load):'PDC'}×${s.reps}`;
const e1rm=(l,r)=>l&&r?l*(1+r/30):null;
const hasSugar=d=>{const D=peekDay(d);return D.meals.some(m=>m.sugar)||!!D.evening?.sugarExtra};
const sugarFree=d=>eveningDone(d)&&!hasSugar(d);
/* séries avec joker : 1 jour non rempli par semaine (lundi-dimanche) ne casse pas la série, jamais deux jours manqués de suite.
   ok(d) = jour réussi ; miss(d) = jour simplement non rempli (rattrapable). Le jour du joker ne s'ajoute pas au compteur. */
function runStreak(ok,miss){const t=TODAY();let d=ok(t)?t:addDays(t,-1),n=0,prev=false;const used=new Set();
  for(let k=0;k<9999;k++){if(ok(d)){n++;prev=false}else{const w=weekStart(d);if(!miss(d)||prev||used.has(w))break;used.add(w);prev=true}d=addDays(d,-1)}
  return n}
const jokerWeek=()=>{const ws=weekStart(TODAY());for(let d=ws;d<TODAY();d=addDays(d,1))if(!morningDone(d)&&!eveningDone(d))return d;return null};
function sugarStreak(){const t=TODAY();if(hasSugar(t))return 0;return runStreak(sugarFree,d=>!hasSugar(d)&&!eveningDone(d))}
function sugarBest(){const ds=Object.keys(db.days).sort();if(!ds.length)return 0;let best=0,cur=0,d=ds[0];const end=TODAY();while(d<=end){if(sugarFree(d)){cur++;best=Math.max(best,cur)}else if(d!==end)cur=0;d=addDays(d,1)}return best}

/* ================= charts ================= */
function lineChart({series,target,h=170,fmtY=v=>fmt(v)}){
  const all=series.flatMap(s=>s.pts);if(!all.length)return '<div class="cell l2" style="font-size:15px">Pas encore de données.</div>';
  const ds=all.map(p=>p.d).sort();const d0=ds[0],d1=ds[ds.length-1],span=Math.max(1,diff(d0,d1));
  const vals=all.map(p=>p.v).concat(target!=null?[target]:[]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const W=340,l=40,r=14,tp=14,b=24,X=d=>l+diff(d0,d)/span*(W-l-r),Y=v=>tp+(hi-v)/(hi-lo)*(h-tp-b);
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  return `<div style="padding:4px 12px 8px"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img">
   ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${fmtY(v)}</text>`).join('')}
   ${target!=null?`<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-r}" y="${Y(target)-5}" text-anchor="end" style="fill:var(--green)">cible ${fmtY(target)}</text>`:''}
   ${series.map(s=>{const pts=s.pts.map(p=>`${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`);const last=s.pts[s.pts.length-1];
     return (s.dots?s.pts.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="${s.color}" opacity="${s.op||1}"/>`).join(''):'')+
       (s.line!==false&&pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.op||1}"/>`:'')+
       (s.end&&last?`<circle cx="${X(last.d)}" cy="${Y(last.v)}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`:'')}).join('')}
   <text x="${l}" y="${h-6}">${fdate(d0)}</text><text x="${W-r}" y="${h-6}" text-anchor="end">${fdate(d1)}</text></svg></div>`}
function barChart({days,vals,target,color='var(--tint)',h=130,fmtV=v=>fmt(v,0)}){
  const mx=Math.max(target||0,...vals.map(v=>v||0))*1.1||1;const W=340,l=34,r=6,tp=12,b=22,bw=(W-l-r)/days.length;const Y=v=>h-b-(v/mx)*(h-tp-b);
  return `<div style="padding:10px 12px 8px"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img">
   <line x1="${l}" x2="${W-r}" y1="${h-b}" y2="${h-b}" stroke="var(--sep)"/><text x="${l-5}" y="${tp+4}" text-anchor="end">${fmtV(mx/1.1)}</text><text x="${l-5}" y="${h-b}" text-anchor="end">0</text>
   ${vals.map((v,k)=>v?`<rect x="${(l+k*bw+2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(h-b-Y(v)).toFixed(1)}" rx="3" fill="${color}" opacity="${k===vals.length-1?1:.55}"/>`:'').join('')}
   ${target?`<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>`:''}
   <text x="${l+2}" y="${h-5}">${fdate(days[0])}</text><text x="${W-r}" y="${h-5}" text-anchor="end">${fdate(days[days.length-1])}</text></svg></div>`}

/* Répartition des modèles selon le rôle (coût faible, modèle pertinent) :
   - réponses des coachs : exécutant rapide et peu cher, qui consulte un conseiller plus fort (outil advisor) seulement pour les questions difficiles ;
   - consultations internes du coach central vers les spécialistes : extraction factuelle, modèle le moins cher. */
const M_HAIKU='claude-haiku-4-5',M_SONNET='claude-sonnet-5-5',M_OPUS='claude-opus-5-5';
const COACH_MODES=[['eco','Économique','Haiku 4.5 seul : le moins cher (≈ 0,5 centime par message), pour les questions simples.'],
 ['eq','Équilibré','Haiku 4.5 répond et consulte Opus 5.5 en conseiller seulement pour les questions difficiles (≈ 0,5 centime, ≈ 3 centimes quand il consulte).'],
 ['max','Expert','Sonnet 5.5 répond et consulte Opus 5.5 en conseiller pour les questions difficiles (≈ 1,5 centime, ≈ 4 centimes avec conseil).']];
function route(role){const m=st().coachMode||'eq';
  if(role==='consult')return m==='max'?{model:M_SONNET,effort:'low'}:{model:M_HAIKU};
  if(m==='eco')return {model:M_HAIKU};
  if(m==='max')return {model:M_SONNET,effort:'medium',advisor:M_OPUS};
  return {model:M_HAIKU,advisor:M_OPUS}}
const ADVISOR_NOTE=`

Tu as un outil « advisor » adossé à un modèle plus fort. Consulte-le une fois avant de répondre quand la question demande un vrai arbitrage, un plan sur plusieurs jours, l’analyse de tendances dans les données ou un conseil important ; pas pour une question simple, factuelle ou de suivi. Donne du poids à son avis, puis réponds toi-même.`;
const backend=()=>C.sample?'claude':st().apiKey?'api':null;
function dataContext(){
  const t=TODAY(),s=st();const lines=[];
  for(let k=13;k>=0;k--){const d=addDays(t,-k),D=peekDay(d),m=D.morning||{},e=D.evening||{},tt=totals(d);

function splitProg(t){const i=t.indexOf('<programme>');if(i<0)return {text:t,prog:null,pending:false};const j=t.indexOf('</programme>',i);
  if(j<0)return {text:t.slice(0,i),prog:null,pending:true};let prog=null;
  try{prog=JSON.parse(t.slice(i+11,j).trim().replace(/^```(json)?/,'').replace(/```$/,''));if(!Array.isArray(prog.templates))prog=null}catch(e){prog='bad'}
  return {text:(t.slice(0,i)+t.slice(j+12)).trim(),prog,pending:false}}
function md(t){const lines=esc(t).split('\n');let html='',list=false;
  for(let l of lines){l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!list){html+='<ul>';list=true}html+='<li>'+m[1]+'</li>'}else{if(list){html+='</ul>';list=false}if(l.trim()&&!/^#+\s*$/.test(l))html+='<p>'+l.replace(/^#+\s*/,'')+'</p>'}}
  if(list)html+='</ul>';return html}

  const turns=chat.filter(m=>!m.err).slice(-20).map(m=>({role:m.role,content:m.content}));while(turns.length&&turns[0].role!=='user')turns.shift();
  try{let out;
    if(backend()==='claude'){const r=await C.sample([{role:'user',content:rules()+'\n\n---\nLa conversation commence ci-dessous.'},...turns],{cache:false,signal:C.ctl.signal,onText:({text})=>{C.live=text;paintLive()}});out=r.text}
    else out=await callApi(turns,C.ctl.signal,t=>{C.live=t;paintLive()});
    chat.push({role:'assistant',content:out});
  }catch(e){const partial=e?.text||C.live;
    if(e?.code==='cancelled'||e?.name==='AbortError'){if(partial)chat.push({role:'assistant',content:partial})}
    else{if(partial&&e?.code!=='refused')chat.push({role:'assistant',content:partial});chat.push({role:'assistant',err:true,content:errCopy[e?.code]||e?.message||'La connexion a échoué. Vérifie ta connexion et réessaie.'})}}

let actx=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){if(!st().sound||!actx)return;try{[0,.28,.56].forEach((o,k)=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=k===2?1320:880;os.connect(g);g.connect(actx.destination);const t0=actx.currentTime+o;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.22);os.start(t0);os.stop(t0+.24)})}catch(e){}}
const haptic=(p=10)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function startTimer(secs,label,extra={}){if(!db.active)return;db.active.timer=Object.assign({kind:'rest',end:Date.now()+secs*1000,total:secs,label,fired:false},extra);save();paintTimer()}
function shortBeep(f=660){if(!st().sound||!actx)return;try{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=f;os.connect(g);g.connect(actx.destination);const t0=actx.currentTime;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.15);os.start(t0);os.stop(t0+.17)}catch(e){}}
function paintTimer(){
  const el=$('#timer');const T=db.active?.timer;
  if(!T||S.tab!=='workout'&&S.tab!=='today'){el.hidden=true;el.dataset.mode='';return}
  el.hidden=false;el.style.bottom=tabsGap()+'px';
  const now=Date.now();const work=T.kind==='work';const prep=work&&now<T.go;
  const rem=prep?(T.go-now)/1000:(T.end-now)/1000;const over=!prep&&rem<=0;
  if(work){const sec=Math.ceil(rem);if(prep&&T.lastTick!==sec){T.lastTick=sec;shortBeep(520)}if(!prep&&!T.started){T.started=true;shortBeep(990);haptic(30)}}
  if(over&&!T.fired){T.fired=true;beep();haptic([200,100,200]);
    if(work){logSet(T.i,{load:T.load,secs:T.total,t:now});return}save()}
  const mode=(prep?'prep':over?'end':'run')+'|'+T.kind+'|'+(T.label||'');
  if(el.dataset.mode!==mode){el.dataset.mode=mode;el.classList.toggle('end',over);el.classList.toggle('work',work&&!prep);
    const title=work?(prep?'Prépare-toi':'Effort · tiens bon'):(over?'Repos terminé':'Repos');
    el.innerHTML=`<div class="in" role="timer" aria-live="off"><span class="t"></span><span class="lab">${title}<b>${over?'Série suivante':esc(T.label||'')}</b></span>
     ${work?`<button data-act="workDone" style="width:auto;padding:0 10px">Terminer</button><button data-act="workCancel" aria-label="Annuler la série">✕</button>`:over?`<button data-act="timerClose" aria-label="Fermer" style="width:auto;padding:0 12px">OK</button>`:`<button data-act="timerAdd" data-d="-15" aria-label="Moins 15 secondes">−15</button><button data-act="timerAdd" data-d="15" aria-label="Plus 15 secondes">+15</button><button data-act="timerClose" aria-label="Passer le repos">Passer</button>`}
     <span class="pb"></span></div>`}
  el.querySelector('.t').textContent=prep?String(Math.ceil(rem)):over?'0:00':mmss(Math.ceil(rem));
  el.querySelector('.pb').style.width=(prep?0:over?100:clamp(1-rem/T.total)*100)+'%';
}
function paintReading(){const el=$('#reader');const R=db.reading;if(!el)return;
  if(!R){if(!el.hidden&&!el.classList.contains('closing')){el.hidden=true;el.dataset.mode=''}return}
  el.hidden=false;const rem=(R.end-Date.now())/1000,over=rem<=0;const C=2*Math.PI*118;
  if(over&&!R.fired){R.fired=true;const D=day(TODAY());D.morning=Object.assign(D.morning||{},{bible:true});save();beep();haptic([200,100,200]);
    setTimeout(()=>{el.classList.add('closing');setTimeout(()=>{db.reading=null;save();el.hidden=true;el.classList.remove('closing');el.dataset.mode='';render()},500)},2400)}
  const mode=over?'done':'run';
  if(el.dataset.mode!==mode){el.dataset.mode=mode;
    el.innerHTML=over?`<div class="rd-in"><svg class="rd-check" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/><path d="M37 62l15 15 32-34"/></svg><div class="rd-done">Validé</div><div class="rd-l">Bonne journée</div></div>`
    :`<div class="rd-in"><div class="rd-ring"><svg viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="118" class="bg"/><circle cx="130" cy="130" r="118" class="fg" stroke-dasharray="${C.toFixed(1)}" transform="rotate(-90 130 130)"/></svg><div class="rd-t num"></div></div>
      <div class="rd-l">${esc(st().reading?.label||'Lecture')}</div><div class="rd-btns"><button data-act="bibleAdd">+1 min</button><button data-act="bibleStop">Arrêter</button></div></div>`}
  if(!over){el.querySelector('.rd-t').textContent=mmss(Math.ceil(rem));el.querySelector('.fg').setAttribute('stroke-dashoffset',(C*clamp(1-rem/R.total)).toFixed(1))}
}

  const hint=($('#mph')?.value||'').trim(),type=document.querySelector('#sf [name=type]:checked')?.value;

    if(!r.ok)throw new Error(r.status===401?'Clé API invalide : vérifie-la dans Réglages.':/credit/i.test(j.error?.message||'')?'Crédit API épuisé : recharge ton compte sur console.anthropic.com.':r.status===429?'Trop de demandes, réessaie dans un instant.':(j.error?.message||'Erreur '+r.status));

    const ag=document.querySelector('.mp-again');if(ag)ag.hidden=false}

function jobAct(act,id,el){const j=jobs().find(x=>x.id===id);
  switch(act){
   case 'jobNew':jobSheet();break;
   case 'jobEdit':if(j)jobSheet(j);break;
   case 'jobGoal':jobGoalSheet();break;
   case 'jobOld':S.carOld=!S.carOld;paintCareer();break;
   case 'carTab':if(S.car===el.dataset.v){const a=$('#area');if(a.scrollTop>8)a.scrollTo({top:0,behavior:reduce()?'auto':'smooth'});else if(S.car===CTABS[0][0])showHome(true);break}S.car=el.dataset.v;try{localStorage.setItem(K+':car',S.car)}catch(e){}haptic(6);paintCareer({top:true});break;
   case 'ctNew':ctSheet();break;
   case 'ctEdit':{const x=contacts().find(c=>c.id===id);if(x)ctSheet(x);break}
   case 'ctMsg':{const x=contacts().find(c=>c.id===id);if(x)ctMsgSheet(x);break}
   case 'ctTpl':{const x=contacts().find(c=>c.id===id);const t=ctTemplates(x).find(y=>y[0]===el.dataset.k);if(!t)break;
     const ta=$('#cmt');if(ta.value.trim()&&!ctTemplates(x).some(y=>y[3]===ta.value)&&!confirm('Remplacer le texte déjà écrit ?'))break;ta.value=t[3];if(t[2])$('#cms').value=t[2];break}
   case 'ctSend':{const x=contacts().find(c=>c.id===id);if(!x)break;const ch=document.querySelector('input[name=ctCh]:checked')?.value||(x.email?'mail':'sms');
     const text=$('#cmt').value.replace(/\s+$/,''),subj=$('#cms').value.trim();if(!text.trim()){hud('Le message est vide');break}
     const url=ch==='mail'?`mailto:${encodeURIComponent(x.email).replace(/%40/g,'@')}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(text)}`:`sms:${x.phone.replace(/[^\d+]/g,'')}&body=${encodeURIComponent(text)}`;
     (x.msgs||(x.msgs=[])).push({d:TODAY(),ch,subj:ch==='mail'?subj:'',text});if(x.msgs.length>30)x.msgs.splice(0,x.msgs.length-30);x.last=TODAY();if(x.next&&x.next<=TODAY())x.next='';save();
     location.href=url;closeSheet();if(careerOn2())paintCareer();break}
   case 'ctDone':{const x=contacts().find(c=>c.id===id);x.last=TODAY();x.next='';const n=$('#cnx');if(n)n.value='';save();haptic();hud('Contact noté');const l=$('#clast');if(l)l.textContent='Dernier contact le '+fdate(x.last);paintCareer();break}
   case 'ctAskDel':asheet('Supprimer ce contact et ses notes ?',[{label:'Supprimer le contact',act:'ctDel',data:{id},danger:true}]);break;
   case 'ctDel':db.contacts=contacts().filter(c=>c.id!==id);save();paintCareer();hud('Contact supprimé');break;
   case 'evNew':evSheet();break;
   case 'evEdit':{const e=events().find(x=>x.id===id);if(e)evSheet(e);break}
   case 'evOld':S.evOld=!S.evOld;repaintArea();break;
   case 'evAskDel':asheet('Supprimer cet événement et ses notes ?',[{label:'Supprimer l’événement',act:'evDel',data:{id},danger:true}]);break;
   case 'evDel':db.events=events().filter(x=>x.id!==id);save();repaintArea();hud('Événement supprimé');break;
   case 'addIv':$('#ivrows').insertAdjacentHTML('beforeend',ivRow());break;
   case 'rmIv':el.closest('[data-ivrow]').remove();break;
   case 'jobMenu':asheet(`${j.company} · envoyée le ${fdate(j.date)}`,[{label:'Relance faite aujourd’hui',act:'jobRelance',data:{id}},{label:'Réponse : entretien',act:'jobIv',data:{id}},{label:'Classer sans réponse',act:'jobSilence',data:{id}},{label:'Réponse : refus',act:'jobRefus',data:{id},danger:true}]);break;
   case 'jobRelance':{const r=j.relances||(j.relances=[]);if(r[r.length-1]===TODAY()){hud('Relance déjà notée aujourd’hui');break}r.push(TODAY());save();haptic();hud('Relance notée');const x=$('#jrel');if(x)x.textContent=relTxt(j);paintCareer();break}
   case 'jobIv':jobSheet(j,{addIv:true});break;
   case 'jobSilence':j.status='silence';save();paintCareer();hud('Classée sans réponse');break;
   case 'jobRefus':j.status='refus';save();paintCareer();hud('Refus noté. La suivante !');break;
   case 'askDelJob':asheet('Supprimer cette candidature ?',[{label:'Supprimer la candidature',act:'delJob',data:{id},danger:true}]);break;
   case 'delJob':db.jobs=jobs().filter(x=>x.id!==id);save();paintCareer();hud('Candidature supprimée');break;
   default:return false}
  return true}
function jobSubmit(f,v){
  if(f.dataset.form==='jobGoal'){car().goal=Math.max(1,+v.goal||5);car().relance=+v.relance||7;save();closeSheet();paintCareer();hud('Objectif enregistré');return}
  let j=jobs().find(x=>x.id===f.dataset.id);const isNew=!j;const before=weekApps();
  if(isNew){j={id:uid(),relances:[]};jobs().push(j)}
  const ivs=[...f.querySelectorAll('[data-ivrow]')].map(r=>({date:r.querySelector('[name=ivd]').value,time:r.querySelector('[name=ivt]').value,kind:r.querySelector('[name=ivk]').value,note:r.querySelector('[name=ivn]').value.trim()})).filter(i=>i.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  Object.assign(j,{company:v.company.trim(),role:(v.role||'').trim(),contract:v.contract||'',location:(v.location||'').trim(),contact:(v.contact||'').trim(),stage:(v.stage||'').trim(),reason:(v.reason||'').trim(),link:(v.link||'').trim(),date:v.date||TODAY(),status:v.status==='envoyee'&&ivs.length?'entretien':v.status,note:(v.note||'').trim(),interviews:ivs});
  save();closeSheet();paintCareer();haptic();
  hud(isNew&&before<car().goal&&weekApps()>=car().goal?'Objectif de la semaine atteint !':isNew?'Candidature ajoutée':'Candidature enregistrée')}
/* ================= section Tâches : to-do avec échéances et priorités ================= */
const PRIO=[['haute','Haute'],['moyenne','Moyenne'],['basse','Basse']];
const REPEAT=[['','Jamais'],['day','Chaque jour'],['weekday','En semaine (lun.–ven.)'],['week','Chaque semaine'],['month','Chaque mois'],['year','Chaque année']];
const REP_SHORT={day:'chaque jour',weekday:'en semaine',week:'chaque semaine',month:'chaque mois',year:'chaque année'};
/* tâche récurrente : prochaine échéance après aujourd'hui (les occurrences manquées sont sautées) */
function stepDue(d,r,dom){if(r==='day')return addDays(d,1);if(r==='week')return addDays(d,7);
  if(r==='weekday'){let n=addDays(d,1);while(dow(n)>4)n=addDays(n,1);return n}
  const [y,m]=d.split('-').map(Number),k=(m-1)+(r==='year'?12:1),ny=y+Math.floor(k/12),nm=k%12+1,last=new Date(ny,nm,0).getDate();
  return `${ny}-${String(nm).padStart(2,'0')}-${String(Math.min(dom||+d.slice(8),last)).padStart(2,'0')}`}
function nextDue(x){let n=stepDue(x.due||TODAY(),x.rep,x.dom);while(n<=TODAY())n=stepDue(n,x.rep,x.dom);return n}
const TD_CATS=['Perso','Travail','Carrière','Admin','Maison','Santé','Finances','Courses'];
const PRIO_C={haute:'var(--red)',moyenne:'var(--orange)',basse:'var(--label3)'};
const todos=()=>db.todos||(db.todos=[]);
const prioRank=p=>({haute:0,moyenne:1,basse:2}[p]??1);
const TBUCKETS=[['late','En retard'],['today','Aujourd’hui'],['tomorrow','Demain'],['week','Dans les 7 jours'],['later','Plus tard'],['none','Sans échéance']];
const todoBucket=(x,t)=>{if(!x.due)return 'none';const n=diff(t,x.due);return n<0?'late':n===0?'today':n===1?'tomorrow':n<=7?'week':'later'};

  const done=todos().filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const cnt=k=>open.filter(x=>todoBucket(x,t)===k).length,week=Date.now()-7*864e5;
  const cell=x=>`<div class="cell td${x.done?' done':''}" style="--pc:${PRIO_C[x.prio]||PRIO_C.moyenne}"><button type="button" class="td-check" data-act="tdToggle" data-id="${x.id}" aria-label="${x.done?'Remettre à faire':'Marquer comme faite'}">${x.done?I.check:''}</button><button type="button" class="td-body" data-act="tdEdit" data-id="${x.id}"><span class="td-t">${esc(x.title)}</span><span class="fn">${[x.due?whenDay(x.due)+(x.time?' à '+esc(x.time):''):null,x.rep?'↻ '+REP_SHORT[x.rep]:null,x.cat&&esc(x.cat),x.note?'note':null].filter(Boolean).join(' · ')||'Sans échéance'}</span></button></div>`;
  if(S.tdView==='events'){v.innerHTML=`<div class="a-in car">${HOMEBTN}<div class="a-head"><p class="l2">Tâches</p><h1>Événements</h1></div>${carEvents()}</div>${bar}`;return}
  if(S.tdView==='week'){const late=open.filter(x=>x.due&&x.due<t).length;
    v.innerHTML=`<div class="a-in">${HOMEBTN}<div class="a-head"><h1>Tâches</h1></div>
     ${late?`<button class="cell tap td-late" data-act="tdViewList">${late} ${T('tâche'+(late>1?'s':'')+' en retard : à replanifier','overdue task'+(late>1?'s':'')+': reschedule')}</button>`:''}
     ${(()=>{const ds=calDays();return calView(calItems(ds[0],ds[ds.length-1],'taches'),{where:'td',focus:1})})()}

async function brShrink(file){if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;

    const k=Math.min(1,2048/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));return b&&b.size<file.size?b:file}catch(e){return file}}

  try{await navigator.clipboard.writeText(text);hud('Invitation copiée')}catch(e){hud('Code : '+g.code)}}
const needNet=()=>{if(!navigator.onLine){hud('Pas de connexion');return true}return false};

document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  switch(act){
   case 'gateMode':showGate(el.dataset.m);break;
   case 'cheer':{if(needNet())break;const id=el.dataset.id;const nm=A.members.find(m=>m.id===id)?.name||'ton ami';if(el.classList.contains('done')){hud('Déjà encouragé aujourd’hui');break}
     el.classList.add('done');haptic(10);
     try{const r=await fnCall({kind:'cheer',to:id});if(r.already){hud('Déjà encouragé aujourd’hui');break}
       A.cheers.push({from_id:A.user.id,to_id:id,day:TODAY()});hud(r.sent?'🔥 Encouragement envoyé à '+nm:nm+' verra ton encouragement dans l’app')}
     catch(e){el.classList.remove('done');hud('Erreur : '+e.message)}break}
   case 'formeSetup':showFormeSetup(true);break;
   case 'reWelcome':showOnboard();break;
   case 'obNext':obNext(false);break;
   case 'obSkip':obNext(true);break;
   case 'obBack':obCollect();S.ob.step=Math.max(0,S.ob.step-1);paintWelcome('back');break;
   case 'obArea':{const k=el.dataset.k,a=S.ob.d.areas,i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);el.classList.toggle('on',i<0);haptic(6);break}
   case 'onboardLater':if($('#gate').dataset.mode==='formeSetup'){st().formeSetup=1;save()}hideGate();break;
   case 'gateSkip':try{localStorage.setItem(AK,'local')}catch(e){}hideGate();if(!st().onboarded)showWelcome();break;
   case 'gateOpen':showGate('login');break;
   case 'groupMenu':if(!A.group)asheet('Groupe d’amis',[{label:'Créer un groupe',act:'groupCreate'},{label:'Rejoindre avec un code',act:'groupJoin'}]);
     else asheet(`${A.group.name} · code ${A.group.code}`,[{label:'Inviter un ami',act:'groupShare'},{label:'Quitter le groupe',act:'groupLeave',danger:true}]);break;
   case 'groupCreate':sheet('Nouveau groupe',`<form id="sf" data-form="gcreate">${sec('',`<label class="cell field" for="gn"><span>Nom</span><input id="gn" name="name" maxlength="40" placeholder="Les motivés"></label>`,'Un code d’invitation est créé : partage-le à tes amis.')}</form>`,{save:'Créer'});break;
   case 'groupJoin':sheet('Rejoindre un groupe',`<form id="sf" data-form="gjoin">${sec('',`<label class="cell field" for="gc"><span>Code</span><input id="gc" name="code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.15em"></label>`,'Le code à 6 caractères envoyé par ton ami.')}</form>`,{save:'Rejoindre'});break;
   case 'groupShare':shareCode();break;
   case 'groupLeave':asheet('Quitter le groupe ? Tu pourras le rejoindre avec son code.',[{label:'Quitter le groupe',act:'groupLeaveGo',danger:true}]);break;
   case 'groupLeaveGo':{if(needNet())break;const g=A.group;if(!g)break;
     const r=await sb.from('group_members').delete().eq('group_id',g.id).eq('user_id',A.user.id);
     if(r.error){hud('Erreur : '+r.error.message);break}
     if(g.owner===A.user.id&&A.members.length<=1)await sb.from('groups').delete().eq('id',g.id);
     A.group=null;A.members=[];A.shares=[];paintFriends();refreshView();hud('Groupe quitté');break}
   case 'logout':asheet('Se déconnecter de cet appareil ? Les données le quittent mais restent dans ton compte. Tes autres appareils restent connectés.',[{label:'Se déconnecter',act:'logoutGo',danger:true}]);break;
   case 'logoutGo':{if(A.dirty||A.flushing){const ok=await cloudFlush();if(!ok){hud('Hors ligne : connecte-toi au réseau d’abord');break}}
     try{await sb.auth.signOut({scope:'local'})}catch(e){} /* seulement cet appareil : les autres restent connectés */
     A.user=null;A.group=null;A.members=[];A.shares=[];A.dirty=false;clearTimeout(A.t);
     db=seed();writeLocal();try{localStorage.removeItem(CK)}catch(e){}chat=[];S.tab='today';
     showHome(false);render();showGate('login','Déconnecté.');break}
   case 'askDeleteMe':asheet('Supprimer ton compte ? Tes données en ligne et ta place dans le groupe sont effacées. Action définitive.',[{label:'Supprimer mon compte',act:'deleteMeGo',danger:true}]);break;
   case 'deleteMeGo':{if(needNet())break;{const paths=notes().flatMap(n=>(n.media||[]).map(m=>m.path)).filter(Boolean);if(paths.length)try{await sb.storage.from(BRAIN_BUCKET).remove(paths)}catch(e){}}const r=await sb.rpc('delete_me');if(r.error){hud('Erreur : '+r.error.message);break}
     try{await sb.auth.signOut()}catch(e){}
     A.user=null;A.group=null;A.members=[];A.shares=[];A.dirty=false;clearTimeout(A.t);delete db.owner;writeLocal();try{localStorage.setItem(AK,'local')}catch(e){}
     refreshView();paintFriends();hud('Compte supprimé');break}
  }});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset?.rd==null)return;const s=st();s.reading=s.reading||{on:false,label:'Lecture',min:10};const k=t.dataset.rd;
  if(k==='on')s.reading.on=t.checked;else if(k==='min'){s.reading.min=Math.max(1,Math.round(num(t.value)||10));t.value=s.reading.min}else s.reading.label=t.value.trim()||'Lecture';save()});
document.addEventListener('submit',async ev=>{const f=ev.target;const k=f.dataset?.form;if(!['auth','onboard','formeSetup','gcreate','gjoin'].includes(k))return;ev.preventDefault();
  if(k==='auth')return doAuth(f);
  if(k==='onboard')return doOnboard(f);
  if(k==='formeSetup')return doFormeSetup(f);
  if(needNet())return;const btn=document.querySelector('.sheet-h .strong');if(btn)btn.disabled=true;
  try{
    if(k==='gcreate'){await groupCreate(String(new FormData(f).get('name')||'').trim());closeSheet();await loadGroup(true);refreshView();hud('Groupe créé · code '+A.group?.code)}
    if(k==='gjoin'){const code=String(new FormData(f).get('code')||'').trim().toUpperCase();if(code.length!==6){hud('Le code fait 6 caractères');if(btn)btn.disabled=false;return}
      const r=await sb.rpc('join_group',{invite:code});if(r.error)throw r.error;closeSheet();await loadGroup(true);refreshView();hud('Bienvenue dans « '+(A.group?.name||'le groupe')+' »')}
  }catch(e){if(btn)btn.disabled=false;hud(/invalide/i.test(e?.message||'')?'Code invalide':'Erreur : '+(e?.message||e))}});
render();keepAwake();showHome(false);cloudBoot();
(function(){const first=$('#splash');if(!first)return;const HTML=first.outerHTML;let hiddenAt=0;
  function play(sp){const short=reduce();if(short)sp.classList.add('short');let done=false;
    const end=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.remove(),420)};
    sp.addEventListener('click',end);setTimeout(end,short?500:3600)}
  play(first);
  /* L'animation se joue à l'ouverture de l'app. Après un simple passage dans une autre app, elle ne se rejoue que si l'absence a duré au moins 30 min.
     Jamais pendant une séance ni une lecture chronométrée. */
  const AWAY=30*60e3;
  const replay=()=>{if(!hiddenAt||Date.now()-hiddenAt<AWAY||db.active||db.reading||$('#splash'))return;document.body.insertAdjacentHTML('afterbegin',HTML);play($('#splash'))};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}replay()});
  window.addEventListener('pageshow',e=>{if(e.persisted)replay()});
})();
})();
</script>
