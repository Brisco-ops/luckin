<script>
(function(){
"use strict";
/* ================= utils ================= */
const K='cap-fit-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const TODAY=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const dow=s=>(new Date(s+'T12:00:00').getDay()+6)%7; // 0 = lundi
const weekStart=s=>addDays(s,-dow(s));
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d});
const fdate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
const fday=s=>new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const $=s=>document.querySelector(s);
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?sum(a)/a.length:null};
const I={
  chev:'<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back:'<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M13.5 3.5 6 11l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus:'<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3.5v15M3.5 11h15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  check:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  up:'<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 15V3.5M4 8l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M5 4.5h5.5a2 2 0 0 1 1.5.7 2 2 0 0 1 1.5-.7H19v14h-5.5a2 2 0 0 0-1.5.7 2 2 0 0 0-1.5-.7H5Z"/><path d="M12 5.2v14"/></svg>',
  stop:'<svg viewBox="0 0 18 18" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="1.5" fill="currentColor"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  meal:'<svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-3 4-3 7h3v11"/></svg>',
  dumb:'<svg viewBox="0 0 24 24"><path d="M2.5 12h19M6 8v8M8.5 6.5v11M15.5 6.5v11M18 8v8"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
  ruler:'<svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4M13.5 8v3M17 8v4"/></svg>',
  wave:'<svg viewBox="0 0 24 24"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M14 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM7 13l4-5 3 2"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 8l1.5 2.5L16 12l-2.5 1.5L12 16l-1.5-2.5L8 12l2.5-1.5Z"/></svg>'
};
const ico=(name,color)=>`<span class="ico" style="background:${color}">${I[name]}</span>`;

/* ================= data ================= */
const SUPPS=['Magnésium','Zinc','Vitamine C','Vitamine D','Créatine','Protéine végétale'];
// Planning des compléments : vitamine C en fin de repas (matin ou midi), zinc en fin de dîner, magnésium au coucher (≥ 1 h après le zinc)
const ALLM=['petitdej','dejeuner','collation','diner'];
const inVitDSeason=()=>{const m=new Date().getMonth()+1;return m>=10||m<=3};
const MEAL_SUPPS=()=>[{name:'Vitamine C',dose:'2 gélules',types:['petitdej','dejeuner']},
  ...(inVitDSeason()?[{name:'Vitamine D',dose:'',types:['petitdej','dejeuner']}]:[]),
  {name:'Zinc',dose:'1 gélule',types:['diner']},{name:'Créatine',dose:'1 dose / jour',types:ALLM}];
const OTHER_SUPPS=['Protéine végétale'];
function suppsTaken(d){const out=[];peekDay(d).meals.forEach(m=>(m.supps||[]).forEach(x=>out.push({name:x,time:m.time,type:m.type,id:m.id})));const e=peekDay(d).evening;(e?.supps||[]).forEach(x=>out.push({name:x,time:x==='Magnésium'?e.magTime:'',type:'soir'}));return out}
const addHour=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);const x=(h+1)%24;return String(x).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const SOURCES=[['maison','Maison'],['deliveroo','Deliveroo'],['fastfood','Fast-food'],['resto','Restaurant']];
const MEALTYPES=[['petitdej','Petit-déj'],['dejeuner','Déjeuner'],['collation','Collation'],['diner','Dîner']];
const CARDIO=[['course','Course'],['piscine','Piscine'],['velo','Vélo'],['rameur','Rameur'],['marche','Marche'],['autre','Autre']];
function seedTemplates(){
  const ex=(name,sets,reps,rest)=>({name,sets,reps,rest});
  return [
   {id:uid(),example:true,name:'Full body A',exercises:[ex('Squat',4,'6-8',40),ex('Développé couché',4,'6-8',40),ex('Rowing barre',3,'8-10',40),ex('Développé militaire haltères',3,'8-10',40),ex('Gainage planche',3,'45 s',40)]},
   {id:uid(),example:true,name:'Full body B',exercises:[ex('Soulevé de terre roumain',3,'8',40),ex('Tractions',4,'max',40),ex('Développé incliné haltères',3,'10',40),ex('Fentes bulgares',3,'10 / jambe',40),ex('Curl + extension triceps',3,'12',40)]}];
}
function seed(){
  let old={};try{old=JSON.parse(localStorage.getItem('cap-objectifs-v1')||'{}').settings||{}}catch(e){}
  return {v:1,settings:{name:old.name||'',onboarded:0,reading:{on:false,label:'Lecture',min:10},supps:false,height:null,startWeight:null,targetWeight:null,targetDate:'',kcalTarget:null,protTarget:null,
    countMode:'kcal',trainingDays:[0,2,4],muscleUnit:'kg',muscleFix:1,restFix:1,diet:'',autoTimer:true,sound:true,failureBonus:true,
    apiKey:old.apiKey||'',model:old.model||'claude-sonnet-5-5',career:{goal:5,relance:7}},
    days:{},workouts:[],templates:seedTemplates(),weekly:{},active:null,foods:[],jobs:[]};
}
let db;
function load(){try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){}return seed()}
function writeLocal(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
function save(){db.mod=Date.now();writeLocal();try{cloudQueue()}catch(e){}}
db=load();
if(!db.settings.restFix){db.templates.forEach(t=>t.exercises.forEach(e=>e.rest=40));const aw=db.active&&db.workouts.find(w=>w.id===db.active.id);if(aw)aw.exercises.forEach(e=>e.rest=40);db.settings.restFix=1;save()}
/* installations existantes : on garde le rituel et les compléments déjà en place */
if(db.settings.onboarded==null){db.settings.onboarded=1;if(db.settings.reading==null)db.settings.reading={on:true,label:'Lecture de la Bible',min:10};if(db.settings.supps==null)db.settings.supps=true;writeLocal()}
/* section Carrière : objectif hebdomadaire et liste des candidatures */
if(db.settings.career==null||!db.jobs){if(db.settings.career==null)db.settings.career={goal:5,relance:7};if(!db.jobs)db.jobs=[];writeLocal()}
if(!db.settings.muscleFix){db.settings.muscleUnit='kg';db.settings.muscleFix=1;save()}
const st=()=>db.settings;
const day=d=>db.days[d]||(db.days[d]={meals:[]});
const peekDay=d=>db.days[d]||{meals:[]};

/* ================= logic ================= */
const HAND={p:{k:120,pr:24},c:{k:110,pr:3},f:{k:100,pr:0},v:{k:25,pr:2}};
function mealKcal(m){if(m.kcal!=null)return m.kcal;if(m.hands)return sum(Object.keys(HAND).map(k=>(m.hands[k]||0)*HAND[k].k));return null}
function mealProt(m){if(m.prot!=null)return m.prot;if(m.hands)return sum(Object.keys(HAND).map(k=>(m.hands[k]||0)*HAND[k].pr));return null}
function totals(d){const ms=peekDay(d).meals;const k=ms.map(mealKcal).filter(x=>x!=null),p=ms.map(mealProt).filter(x=>x!=null);
  return {kcal:k.length?sum(k):null,prot:p.length?sum(p):null,off:ms.filter(m=>m.source&&m.source!=='maison').length,n:ms.length}}
const morningDone=d=>{const m=peekDay(d).morning;return !!(m&&(m.weight!=null||m.sleepH!=null))};
const eveningDone=d=>!!peekDay(d).evening?.done;
const isTrainingDay=d=>st().trainingDays.includes(dow(d));
const workoutsOn=d=>db.workouts.filter(w=>w.date===d&&w.end);
function weightSeries(){return Object.keys(db.days).sort().map(d=>({d,v:db.days[d].morning?.weight})).filter(x=>x.v!=null)}
function movAvg(series,n=7){return series.map(p=>{const from=addDays(p.d,-(n-1));const w=series.filter(q=>q.d>=from&&q.d<=p.d);return {d:p.d,v:avg(w.map(q=>q.v))}})}
function lastWeightAvg(ref=TODAY()){const s=weightSeries().filter(p=>p.d<=ref&&p.d>addDays(ref,-7));return avg(s.map(p=>p.v))}
function lastPerf(name,excludeId){for(let i=db.workouts.length-1;i>=0;i--){const w=db.workouts[i];if(w.id===excludeId||!w.end||w.kind!=='muscu')continue;const e=w.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e&&e.logged.length)return {date:w.date,sets:e.logged}}return null}
function timedSecs(e){const m=String(e?.reps||'').trim().match(/^(\d+(?:[.,]\d+)?)\s*(s|sec|secondes?|min|mn)\b/i);if(!m)return null;const n=num(m[1]);return /^m/i.test(m[2])?Math.round(n*60):Math.round(n)}
const setTxt=s=>s.secs!=null?`${s.secs} s${s.load?' · '+fmt(s.load)+' kg':''}`:`${s.load!=null?fmt(s.load):'PDC'}×${s.reps}`;
const e1rm=(l,r)=>l&&r?l*(1+r/30):null;
const hasSugar=d=>{const D=peekDay(d);return D.meals.some(m=>m.sugar)||!!D.evening?.sugarExtra};
const sugarFree=d=>eveningDone(d)&&!hasSugar(d);
function sugarStreak(){const t=TODAY();if(hasSugar(t))return 0;let d=eveningDone(t)?t:addDays(t,-1);let n=0;while(sugarFree(d)&&n<9999){n++;d=addDays(d,-1)}return n}
function sugarBest(){const ds=Object.keys(db.days).sort();if(!ds.length)return 0;let best=0,cur=0,d=ds[0];const end=TODAY();while(d<=end){if(sugarFree(d)){cur++;best=Math.max(best,cur)}else if(d!==end)cur=0;d=addDays(d,1)}return best}
const FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.5 2c.4 3-1.3 4.8-2.8 6.4C8.1 10.1 6.5 11.8 6.5 14.6 6.5 18.7 9 22 12.6 22c3.7 0 6-2.8 6-6.6 0-2.9-1.4-4.7-2.5-6-.2 1.5-.8 2.6-1.8 3.2.3-3.6-.4-7.6-1.8-10.6Z"/></svg>';
function streak(){let d=TODAY();if(!morningDone(d)&&!eveningDone(d))d=addDays(d,-1);let n=0;while((morningDone(d)||eveningDone(d))&&n<999){n++;d=addDays(d,-1)}return n}
function weekStats(ref){
  const ws=weekStart(ref),days=Array.from({length:7},(_,k)=>addDays(ws,k)).filter(d=>d<=TODAY());
  const meals=days.flatMap(d=>peekDay(d).meals);
  const pt=st().protTarget;
  return {ws,days:days.length,morning:days.filter(morningDone).length,evening:days.filter(eveningDone).length,
    sessions:db.workouts.filter(w=>w.end&&w.date>=ws&&w.date<=addDays(ws,6)).length,planned:st().trainingDays.length,
    meals:meals.length,home:meals.filter(m=>m.source==='maison').length,
    protHit:pt?days.filter(d=>(totals(d).prot||0)>=pt*0.9).length:null,
    wAvg:avg(days.map(d=>peekDay(d).morning?.weight)),wPrev:avg(Array.from({length:7},(_,k)=>peekDay(addDays(ws,k-7)).morning?.weight)),
    alcohol:sum(days.map(d=>peekDay(d).evening?.alcohol||0))};
}
function defaultMealType(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?'petitdej':h<15?'dejeuner':h<18.5?'collation':'diner'}

/* ================= navigation ================= */
const S={tab:'today',openEx:null,more:false};

/* ================= components ================= */
const isList=b=>/^\s*<(button|div|label|form)[^>]*class="cell|^\s*<form/.test(b);
const sec=(head,body,foot='',cls='')=>`<section class="sec">${head?`<div class="sec-h">${head}</div>`:''}<div class="group ${cls}${isList(body)&&!/tiles|notile/.test(cls)?' tiles':''}">${body}</div>${foot?`<div class="sec-f">${foot}</div>`:''}</section>`;
const addCell=(label,act,data='')=>`<button type="button" class="cell tap link" data-act="${act}" ${data}><span class="plus">${I.plus}</span><span>${label}</span></button>`;
function seg(name,opts,val){return `<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" id="${name}-${v}" name="${name}" value="${v}" ${String(v)===String(val)?'checked':''}><span>${l}</span></label>`).join('')}</div>`}
const scale=(name,from,to,val)=>seg(name,Array.from({length:to-from+1},(_,k)=>[from+k,from+k]),val);
const state=ok=>`<span class="state ${ok?'ok':''}">${ok?I.check:''}</span>`;
const fieldNum=(id,label,val,unit,ph='')=>`<label class="cell field" for="${id}"><span>${label}</span><input id="${id}" name="${id}" type="text" inputmode="decimal" value="${val??''}" placeholder="${ph}" autocomplete="off"><span class="l2" style="min-width:${unit?'auto':'0'}">${unit}</span></label>`;

/* ================= charts ================= */
function lineChart({series,target,h=170,fmtY=v=>fmt(v)}){
  const all=series.flatMap(s=>s.pts);if(!all.length)return '<div class="cell l2" style="font-size:15px">Pas encore de données.</div>';
  const ds=all.map(p=>p.d).sort();const d0=ds[0],d1=ds[ds.length-1],span=Math.max(1,diff(d0,d1));
  const vals=all.map(p=>p.v).concat(target!=null?[target]:[]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const W=340,l=40,r=14,tp=14,b=24,X=d=>l+diff(d0,d)/span*(W-l-r),Y=v=>tp+(hi-v)/(hi-lo)*(h-tp-b);
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  return `<div style="padding:4px 12px 8px"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img">
   ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${fmtY(v)}</text>`).join('')}
   ${target!=null?`<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-r}" y="${Y(target)-5}" text-anchor="end" style="fill:var(--green)">cible ${fmtY(target)}</text>`:''}
   ${series.map(s=>{const pts=s.pts.map(p=>`${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`);const last=s.pts[s.pts.length-1];
     return (s.dots?s.pts.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="${s.color}" opacity="${s.op||1}"/>`).join(''):'')+
       (s.line!==false&&pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.op||1}"/>`:'')+
       (s.end&&last?`<circle cx="${X(last.d)}" cy="${Y(last.v)}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`:'')}).join('')}
   <text x="${l}" y="${h-6}">${fdate(d0)}</text><text x="${W-r}" y="${h-6}" text-anchor="end">${fdate(d1)}</text></svg></div>`}
function barChart({days,vals,target,color='var(--tint)',h=130,fmtV=v=>fmt(v,0)}){
  const mx=Math.max(target||0,...vals.map(v=>v||0))*1.1||1;const W=340,l=34,r=6,tp=12,b=22,bw=(W-l-r)/days.length;const Y=v=>h-b-(v/mx)*(h-tp-b);
  return `<div style="padding:10px 12px 8px"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img">
   <line x1="${l}" x2="${W-r}" y1="${h-b}" y2="${h-b}" stroke="var(--sep)"/><text x="${l-5}" y="${tp+4}" text-anchor="end">${fmtV(mx/1.1)}</text><text x="${l-5}" y="${h-b}" text-anchor="end">0</text>
   ${vals.map((v,k)=>v?`<rect x="${(l+k*bw+2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(h-b-Y(v)).toFixed(1)}" rx="3" fill="${color}" opacity="${k===vals.length-1?1:.55}"/>`:'').join('')}
   ${target?`<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>`:''}
   <text x="${l+2}" y="${h-5}">${fdate(days[0])}</text><text x="${W-r}" y="${h-5}" text-anchor="end">${fdate(days[days.length-1])}</text></svg></div>`}

function nextTemplate(){if(!db.templates.length)return null;const done=db.workouts.filter(w=>w.end&&w.kind==='muscu'&&w.templateId);const last=done[done.length-1];

function exState(e){return e.logged.length>=e.sets?'done':''}

${ts!=null?`      <div class="inrow"><div><div class="lbl">Durée (s)</div><div class="numbox"><button type="button" data-step="du-${i}" data-d="-5" aria-label="Moins 5 secondes">−</button><input id="du-${i}" name="secs" inputmode="numeric" value="${prev?.secs??ts}" placeholder="${ts}"><button type="button" data-step="du-${i}" data-d="5" aria-label="Plus 5 secondes">+</button></div></div>

      <button class="rest-btn" style="align-self:center">Valider sans chrono</button>
`:`      <div class="inrow"><div><div class="lbl">Charge (kg)</div><div class="numbox"><button type="button" data-step="ld-${i}" data-d="-2.5" aria-label="Moins 2,5 kg">−</button><input id="ld-${i}" name="load" inputmode="decimal" value="${prev?.load!=null?String(prev.load).replace('.',','):''}" placeholder="0"><button type="button" data-step="ld-${i}" data-d="2.5" aria-label="Plus 2,5 kg">+</button></div></div>
      <div><div class="lbl">Répétitions</div><div class="numbox"><button type="button" data-step="rp-${i}" data-d="-1" aria-label="Moins une">−</button><input id="rp-${i}" name="reps" inputmode="numeric" value="${prev?.reps??''}" placeholder="0"><button type="button" data-step="rp-${i}" data-d="1" aria-label="Plus une">+</button></div></div></div>

  return `<div class="lt wk-head"><div><span class="eyebrow">Séance en cours</span><h1 class="sm">${esc(w.name)}</h1></div><span class="elapsed" id="elapsed">${mmss((Date.now()-w.start)/1000)}</span></div>

/* ================= views: stats ================= */
function vStats(){
  const s=st(),t=TODAY();const ws=weightSeries();const ma=movAvg(ws);
  const d14=Array.from({length:14},(_,k)=>addDays(t,k-13));
  const fat=Object.keys(db.days).sort().map(d=>({d,v:db.days[d].morning?.fat})).filter(x=>x.v!=null);
  const mus=Object.keys(db.days).sort().map(d=>({d,v:db.days[d].morning?.muscle})).filter(x=>x.v!=null);
  const waist=Object.keys(db.weekly).sort().map(d=>({d,v:db.weekly[d].waist})).filter(x=>x.v!=null);
  const W=weekStats(t);
  // exercise progression
  const names=[...new Set(db.workouts.filter(w=>w.end&&w.kind==='muscu').flatMap(w=>w.exercises.filter(e=>e.logged.length).map(e=>e.name)))];
  const exn=S.ex&&names.includes(S.ex)?S.ex:names[0];
  const prog=exn?db.workouts.filter(w=>w.end&&w.kind==='muscu').map(w=>{const e=w.exercises.find(x=>x.name===exn);if(!e||!e.logged.length)return null;return {d:w.date,v:Math.max(...e.logged.map(x=>e1rm(x.load,x.reps)||0))}}).filter(x=>x&&x.v):[];
  // bloating by source
  const meals30=Object.keys(db.days).filter(d=>d>addDays(t,-30)).flatMap(d=>db.days[d].meals);
  const withB=meals30.filter(m=>m.bloat&&m.bloat.score!=null);
  const bySrc=SOURCES.map(([k,l])=>{const a=withB.filter(m=>m.source===k);return [l,a.length,avg(a.map(m=>m.bloat.score))]}).filter(x=>x[1]);
  const bySpeed=[['rapide','Repas rapide'],['pose','Repas posé']].map(([k,l])=>{const a=withB.filter(m=>m.speed===k);return [l,a.length,avg(a.map(m=>m.bloat.score))]}).filter(x=>x[1]);
  const wk8=Array.from({length:8},(_,k)=>addDays(weekStart(t),(k-7)*7));
  return `<div class="lt"><span class="eyebrow">14 derniers jours et plus</span><h1>Suivi</h1></div>
  ${sec('Cette semaine',`<div class="kpis tilesrow"><div><span class="v">${W.morning}/${W.days}</span><span class="k">réveils</span></div><div><span class="v">${W.evening}/${W.days}</span><span class="k">soirs</span></div><div><span class="v">${W.sessions}/${W.planned}</span><span class="k">séances</span></div><div><span class="v">${W.meals?Math.round(W.home/W.meals*100)+' %':'–'}</span><span class="k">repas maison</span></div></div>`,
    `${W.protHit!=null?`Objectif protéines atteint ${W.protHit} jour${W.protHit>1?'s':''} sur ${W.days}. `:''}${W.wAvg!=null&&W.wPrev!=null?`Poids moyen ${fmt(W.wAvg)} kg (${W.wAvg-W.wPrev>0?'+':''}${fmt(W.wAvg-W.wPrev)} kg vs semaine précédente).`:''}`)}
  ${sec('Poids',lineChart({series:[{pts:ws,color:'var(--label3)',dots:true,line:false},{pts:ma,color:'var(--tint)',end:true}],target:s.targetWeight})+`<div class="legend"><span><i style="background:var(--label3)"></i>pesées</span><span><i style="background:var(--tint)"></i>moyenne 7 jours</span></div>`,

function splitProg(t){const i=t.indexOf('<programme>');if(i<0)return {text:t,prog:null,pending:false};const j=t.indexOf('</programme>',i);
  if(j<0)return {text:t.slice(0,i),prog:null,pending:true};let prog=null;
  try{prog=JSON.parse(t.slice(i+11,j).trim().replace(/^```(json)?/,'').replace(/```$/,''));if(!Array.isArray(prog.templates))prog=null}catch(e){prog='bad'}
  return {text:(t.slice(0,i)+t.slice(j+12)).trim(),prog,pending:false}}
function md(t){const lines=esc(t).split('\n');let html='',list=false;
  for(let l of lines){l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!list){html+='<ul>';list=true}html+='<li>'+m[1]+'</li>'}else{if(list){html+='</ul>';list=false}if(l.trim()&&!/^#+\s*$/.test(l))html+='<p>'+l.replace(/^#+\s*/,'')+'</p>'}}
  if(list)html+='</ul>';return html}

function liveHTML(){const p=splitProg(C.live);if(!C.live)return `<div class="msg a"><span class="typing"><i></i><i></i><i></i></span></div>`;

const errCopy={not_granted:'Accès refusé : autorise le coach à utiliser Claude pour continuer.',rate_limited:'Trop de demandes pour le moment. Réessaie dans un instant.',session_expired:'Reconnecte-toi à Claude puis réessaie.',refused:'Le coach n’a pas pu répondre à ce message. Reformule-le.',prompt_too_large:'La conversation est trop longue. Démarre une nouvelle conversation.',sampling_disabled:'Claude n’est pas disponible pour ce compte.'};
async function callApi(turns,signal,onText){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':st().apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:st().model||'claude-sonnet-5-5',max_tokens:6000,stream:true,system:rules(),messages:turns})});
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw {code:'api',message:r.status===401?'Clé API invalide. Vérifie-la dans Réglages.':r.status===429?'Limite de requêtes atteinte. Réessaie dans un instant.':/credit/i.test(m)?'Crédit API épuisé : recharge ton compte sur console.anthropic.com.':'Erreur du service ('+r.status+') '+m}}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop();
    for(const ln of parts){if(!ln.startsWith('data:'))continue;let ev;try{ev=JSON.parse(ln.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta?.type==='text_delta'){text+=ev.delta.text;onText(text)}if(ev.type==='error')throw {code:'api',message:ev.error?.message||'Erreur du service'}}}
  return text;
}
async function send(text){
  text=text.trim();if(!text||C.busy)return;const ci=$('#cin');if(ci)ci.value='';
  chat.push({role:'user',content:text});saveChat();C.busy=true;C.live='';C.ctl=new AbortController();render();window.scrollTo(0,document.body.scrollHeight);
  const turns=chat.filter(m=>!m.err).slice(-20).map(m=>({role:m.role,content:m.content}));while(turns.length&&turns[0].role!=='user')turns.shift();
  try{let out;
    if(backend()==='claude'){const r=await C.sample([{role:'user',content:rules()+'\n\n---\nLa conversation commence ci-dessous.'},...turns],{cache:false,signal:C.ctl.signal,onText:({text})=>{C.live=text;paintLive()}});out=r.text}
    else out=await callApi(turns,C.ctl.signal,t=>{C.live=t;paintLive()});
    chat.push({role:'assistant',content:out});
  }catch(e){const partial=e?.text||C.live;
    if(e?.code==='cancelled'||e?.name==='AbortError'){if(partial)chat.push({role:'assistant',content:partial})}
    else{if(partial&&e?.code!=='refused')chat.push({role:'assistant',content:partial});chat.push({role:'assistant',err:true,content:errCopy[e?.code]||e?.message||'La connexion a échoué. Vérifie ta connexion et réessaie.'})}}
  C.busy=false;C.live='';saveChat();render();window.scrollTo(0,document.body.scrollHeight);
}

function beep(){if(!st().sound||!actx)return;try{[0,.28,.56].forEach((o,k)=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=k===2?1320:880;os.connect(g);g.connect(actx.destination);const t0=actx.currentTime+o;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.22);os.start(t0);os.stop(t0+.24)})}catch(e){}}
const haptic=(p=10)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function startTimer(secs,label,extra={}){if(!db.active)return;db.active.timer=Object.assign({kind:'rest',end:Date.now()+secs*1000,total:secs,label,fired:false},extra);save();paintTimer()}
function shortBeep(f=660){if(!st().sound||!actx)return;try{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=f;os.connect(g);g.connect(actx.destination);const t0=actx.currentTime;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.15);os.start(t0);os.stop(t0+.17)}catch(e){}}
function paintTimer(){
  const el=$('#timer');const T=db.active?.timer;
  if(!T||S.tab!=='workout'&&S.tab!=='today'){el.hidden=true;el.dataset.mode='';return}
  el.hidden=false;el.style.bottom=tabsGap()+'px';
  const now=Date.now();const work=T.kind==='work';const prep=work&&now<T.go;
  const rem=prep?(T.go-now)/1000:(T.end-now)/1000;const over=!prep&&rem<=0;
  if(work){const sec=Math.ceil(rem);if(prep&&T.lastTick!==sec){T.lastTick=sec;shortBeep(520)}if(!prep&&!T.started){T.started=true;shortBeep(990);haptic(30)}}
  if(over&&!T.fired){T.fired=true;beep();haptic([200,100,200]);
    if(work){logSet(T.i,{load:T.load,secs:T.total,t:now});return}save()}
  const mode=(prep?'prep':over?'end':'run')+'|'+T.kind+'|'+(T.label||'');
  if(el.dataset.mode!==mode){el.dataset.mode=mode;el.classList.toggle('end',over);el.classList.toggle('work',work&&!prep);
    const title=work?(prep?'Prépare-toi':'Effort · tiens bon'):(over?'Repos terminé':'Repos');
    el.innerHTML=`<div class="in" role="timer" aria-live="off"><span class="t"></span><span class="lab">${title}<b>${over?'Série suivante':esc(T.label||'')}</b></span>
     ${work?`<button data-act="workDone" style="width:auto;padding:0 10px">Terminer</button><button data-act="workCancel" aria-label="Annuler la série">✕</button>`:over?`<button data-act="timerClose" aria-label="Fermer" style="width:auto;padding:0 12px">OK</button>`:`<button data-act="timerAdd" data-d="-15" aria-label="Moins 15 secondes">−15</button><button data-act="timerAdd" data-d="15" aria-label="Plus 15 secondes">+15</button><button data-act="timerClose" aria-label="Passer le repos">Passer</button>`}
     <span class="pb"></span></div>`}
  el.querySelector('.t').textContent=prep?String(Math.ceil(rem)):over?'0:00':mmss(Math.ceil(rem));
  el.querySelector('.pb').style.width=(prep?0:over?100:clamp(1-rem/T.total)*100)+'%';
}
function paintReading(){const el=$('#reader');const R=db.reading;if(!el)return;
  if(!R){if(!el.hidden&&!el.classList.contains('closing')){el.hidden=true;el.dataset.mode=''}return}
  el.hidden=false;const rem=(R.end-Date.now())/1000,over=rem<=0;const C=2*Math.PI*118;
  if(over&&!R.fired){R.fired=true;const D=day(TODAY());D.morning=Object.assign(D.morning||{},{bible:true});save();beep();haptic([200,100,200]);
    setTimeout(()=>{el.classList.add('closing');setTimeout(()=>{db.reading=null;save();el.hidden=true;el.classList.remove('closing');el.dataset.mode='';render()},500)},2400)}
  const mode=over?'done':'run';
  if(el.dataset.mode!==mode){el.dataset.mode=mode;
    el.innerHTML=over?`<div class="rd-in"><svg class="rd-check" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/><path d="M37 62l15 15 32-34"/></svg><div class="rd-done">Validé</div><div class="rd-l">Bonne journée</div></div>`
    :`<div class="rd-in"><div class="rd-ring"><svg viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="118" class="bg"/><circle cx="130" cy="130" r="118" class="fg" stroke-dasharray="${C.toFixed(1)}" transform="rotate(-90 130 130)"/></svg><div class="rd-t num"></div></div>
      <div class="rd-l">${esc(st().reading?.label||'Lecture')}</div><div class="rd-btns"><button data-act="bibleAdd">+1 min</button><button data-act="bibleStop">Arrêter</button></div></div>`}
  if(!over){el.querySelector('.rd-t').textContent=mmss(Math.ceil(rem));el.querySelector('.fg').setAttribute('stroke-dashoffset',(C*clamp(1-rem/R.total)).toFixed(1))}
}

function startWorkout(tid){const t=db.templates.find(x=>x.id===tid);
  const w={id:uid(),date:TODAY(),kind:'muscu',templateId:t?.id||null,name:t?.name||'Séance libre',start:Date.now(),end:null,exercises:(t?.exercises||[]).map(e=>({name:e.name,sets:+e.sets||3,reps:e.reps||'',rest:+e.rest||40,logged:[],tech:''})),feel:null,note:''};
  db.workouts.push(w);db.active={id:w.id,timer:null};S.openEx=null;save();unlockAudio();keepAwake();S.tab='workout';render({top:true});if(!t)addExSheet()}
function logSet(i,s){const w=db.workouts.find(x=>x.id===db.active.id);const e=w.exercises[i];
  e.logged.push(s);haptic();
  if(e.logged.length>=e.sets&&S.openEx===i)S.openEx=null;
  const last=w.exercises.every(x=>x.logged.length>=x.sets);
  if(db.active.timer?.kind==='work')db.active.timer=null;
  if(st().autoTimer&&!last){const bonus=s.rir===0&&st().failureBonus?30:0;const nextEx=e.logged.length>=e.sets?w.exercises.find(x=>x.logged.length<x.sets):e;startTimer(e.rest+bonus,(nextEx?nextEx.name:e.name)+(bonus?' · +30 s (échec)':''))}
  save();render();if(last)hud('Tous les exercices sont faits. Termine la séance.')}

function parseHealth(txt){const map={poids:'weight',weight:'weight',mg:'fat',fat:'fat',muscle:'muscle',visceral:'visceral',visc:'visceral',sommeil:'sleepH',sleep:'sleepH',pas:'steps',steps:'steps',eau:'water'};const out={};
  String(txt||'').split(/[;\n,&](?=\s*[a-zA-Zéè]+\s*[=:])/).forEach(p=>{const m=p.match(/([a-zA-Zéè]+)\s*[=:]\s*([\d.,]+)/);if(m&&map[m[1].toLowerCase()])out[map[m[1].toLowerCase()]]=num(m[2])});return out}
function applyHealth(o){const t=TODAY(),D=day(t);const mk=['weight','fat','muscle','visceral','sleepH'],ek=['steps','water'];let n=0;
  mk.forEach(k=>{if(o[k]!=null){D.morning=D.morning||{};D.morning[k]=o[k];if(!D.morning.time)D.morning.time=nowHM();n++}});
  ek.forEach(k=>{if(o[k]!=null){D.evening=D.evening||{};D.evening[k]=o[k];n++}});save();return n}
async function importHealth(){let txt='';try{txt=await navigator.clipboard.readText()}catch(e){}
  if(!txt){sheet('Coller les données Santé',`<form id="sf" data-form="healthPaste">${sec('',`<div class="cell"><textarea name="t" rows="4" placeholder="poids=81,2; mg=18,4; pas=8450"></textarea></div>`,'Colle le texte copié par ton raccourci.')}</form>`,{save:'Importer'});return}
  const o=parseHealth(txt);const n=applyHealth(o);closeSheet(true);render();hud(n?`${n} valeur${n>1?'s':''} importée${n>1?'s':''}`:'Aucune valeur reconnue dans le presse-papiers')}

const cloudCopy=()=>{const c=JSON.parse(JSON.stringify(db));if(c.settings)c.settings.apiKey='';return c};
function progressPct(ref){const s=st();const a=lastWeightAvg(ref);
  if(s.startWeight==null||s.targetWeight==null||a==null||s.startWeight===s.targetWeight)return null;
  return Math.round(clamp((s.startWeight-a)/(s.startWeight-s.targetWeight))*100)}
function shareRow(d){return {user_id:A.user.id,day:d,morning:morningDone(d),evening:eveningDone(d),session:workoutsOn(d).length>0,progress:progressPct(d)}}
async function cloudFlush(){
  if(!sb||!A.user||A.flushing)return false;if(!navigator.onLine){A.dirty=true;return false}
  A.flushing=true;A.dirty=false;const me=A.user.id;let ok=true;
  try{
    const r=await sb.from('user_data').upsert({user_id:me,data:cloudCopy(),updated_at:new Date().toISOString()});if(r.error)throw r.error;
    const t=TODAY();const rows=Array.from({length:7},(_,k)=>shareRow(addDays(t,-k)));
    const r2=await sb.from('daily_share').upsert(rows,{onConflict:'user_id,day'});if(r2.error)throw r2.error;
    const nm=st().name||'';if(A.sentName!==nm){const r3=await sb.from('profiles').upsert({id:me,name:nm});if(!r3.error)A.sentName=nm}
  }catch(e){ok=false;A.dirty=true}
  A.flushing=false;
  if(A.dirty){clearTimeout(A.t);A.t=setTimeout(cloudFlush,ok?1500:10000)}
  return ok}
window.addEventListener('online',()=>{if(A.dirty)cloudFlush()});
document.addEventListener('visibilitychange',()=>{if(!A.user)return;
  if(document.visibilityState==='hidden'){if(A.dirty)cloudFlush()}
  else{cloudPull(true).then(ch=>{if(ch)refreshAll()});loadGroup(true)}});

const blankLocal=()=>!Object.keys(db.days).length&&!db.workouts.length;
/* Récupère les données du compte. Renvoie true si les données locales ont été remplacées. */
async function cloudPull(onlyIfNewer){
  if(!sb||!A.user)return false;
  if(onlyIfNewer&&(A.dirty||A.flushing||db.active||$('#layer').innerHTML))return false;
  let res;try{res=await sb.from('user_data').select('data').eq('user_id',A.user.id).maybeSingle()}catch(e){return false}
  if(res.error)return false;
  const mine=!db.owner||db.owner===A.user.id;const remote=res.data?.data;
  if(remote&&remote.settings){
    if(!mine||blankLocal()||(remote.mod||0)>(db.mod||0)){const key=mine?st().apiKey:'';db=remote;db.settings.apiKey=key||'';db.owner=A.user.id;writeLocal();return true}
    return false}
  if(onlyIfNewer)return false;
  if(!mine){db=seed()}
  db.owner=A.user.id;writeLocal();return true}
function refreshAll(){if(!$('#home').hidden)paintHome();else if(careerOn())paintCareer();else if($('#area').hidden)render();const ini=$('#tabs .ini');if(ini)ini.textContent=(st().name||'?').trim().charAt(0).toUpperCase()}
async function cloudStart(user){
  A.user=user;A.sentName=null;try{localStorage.removeItem(AK)}catch(e){}
  const mine=!db.owner||db.owner===user.id;
  const changed=await cloudPull(false);
  if(!mine&&!changed){db=seed();db.owner=user.id;writeLocal()}
  hideGate();refreshAll();cloudQueue();loadGroup(true);notifRefresh();
  if(!st().onboarded)showOnboard()}
async function cloudBoot(){
  if(!sb){if(!st().onboarded)showOnboard();return}
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(session?.user){await cloudStart(session.user);return}
  let skip=null;try{skip=localStorage.getItem(AK)}catch(e){}
  if(skip==='local'){if(!st().onboarded)showOnboard()}else showGate('signup')}

const authErr=e=>{const m=String(e?.message||e||'');
  if(/invalid login/i.test(m))return 'E-mail ou mot de passe incorrect.';
  if(/already registered|already exists/i.test(m))return 'Ce compte existe déjà : touche « J’ai déjà un compte ».';
  if(/not confirmed/i.test(m))return 'Adresse pas encore confirmée : ouvre l’e-mail reçu.';
  if(/rate limit|too many/i.test(m))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/password/i.test(m))return 'Mot de passe trop faible : 6 caractères minimum.';
  if(/fetch|network|load failed/i.test(m))return 'Pas de connexion. Vérifie ton réseau.';
  return m||'Erreur inconnue.'};
async function doAuth(f){const v=Object.fromEntries(new FormData(f));const email=String(v.email||'').trim().toLowerCase(),pw=String(v.pw||'');const up=$('#gate').dataset.mode==='signup';
  const msg=t=>{f.querySelector('.g-msg').textContent=t};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return msg('Adresse e-mail invalide.');
  if(pw.length<6)return msg('Mot de passe : 6 caractères minimum.');
  if(!sb)return msg('Connexion impossible : vérifie ton réseau puis relance l’app.');
  const b=f.querySelector('.g-go');b.disabled=true;msg(up?'Création du compte…':'Connexion…');
  try{const r=up?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    if(!r.data.session){b.disabled=false;return msg('Compte créé. Ouvre l’e-mail de confirmation, puis connecte-toi.')}
    await cloudStart(r.data.user);hud(up?'Compte créé':'Connecté')}
  catch(e){b.disabled=false;msg(authErr(e))}}

async function loadGroup(force){
  if(!sb||!A.user)return;if(!force&&Date.now()-A.lastFetch<30000)return;A.lastFetch=Date.now();
  try{
    const m=await sb.from('group_members').select('group_id').eq('user_id',A.user.id);if(m.error)throw m.error;
    if(!m.data.length){A.group=null;A.members=[];A.shares=[]}
    else{
      const g=await sb.from('groups').select('id,code,name,owner').in('id',m.data.map(x=>x.group_id));if(g.error)throw g.error;
      A.group=(g.data||[])[0]||null;
      if(A.group){
        const mem=await sb.from('group_members').select('user_id').eq('group_id',A.group.id);if(mem.error)throw mem.error;
        const ids=mem.data.map(x=>x.user_id);
        const [p,sh]=await Promise.all([sb.from('profiles').select('id,name').in('id',ids),
          sb.from('daily_share').select('user_id,day,morning,evening,session,progress').in('user_id',ids).gte('day',addDays(TODAY(),-6))]);
        A.members=ids.map(id=>({id,name:(p.data||[]).find(x=>x.id===id)?.name||'Ami'}));A.shares=sh.data||[];
        const ch=await sb.from('cheers').select('from_id,to_id,day').gte('day',addDays(TODAY(),-6));A.cheers=ch.data||[];
      }}
  }catch(e){}
  paintFriends();
  if(S.tab==='settings'&&$('#home').hidden&&$('#area').hidden&&!$('#layer').innerHTML&&!document.activeElement?.matches?.('input,textarea'))render()}

  const prog=id===A.user.id?progressPct(TODAY()):([...A.shares].filter(x=>x.user_id===id&&x.progress!=null).sort((a,b)=>b.day.localeCompare(a.day))[0]?.progress??null);
  return {rows,prog,reg:rows.filter(r=>r.morning&&r.evening).length,sess:rows.filter(r=>r.session).length}}

  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e?.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);hud('Invitation copiée')}catch(e){hud('Code : '+g.code)}}
const needNet=()=>{if(!navigator.onLine){hud('Pas de connexion');return true}return false};

document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  switch(act){
   case 'gateMode':showGate(el.dataset.m);break;
   case 'notifTest':{if(needNet())break;try{const r=await fnCall({kind:'test'});hud(r.sent?'Notification envoyée':'Aucun appareil abonné')}catch(e){hud('Erreur : '+e.message)}break}
   case 'cheer':{if(needNet())break;const id=el.dataset.id;const nm=A.members.find(m=>m.id===id)?.name||'ton ami';if(el.classList.contains('done')){hud('Déjà encouragé aujourd’hui');break}
     el.classList.add('done');haptic(10);
     try{const r=await fnCall({kind:'cheer',to:id});if(r.already){hud('Déjà encouragé aujourd’hui');break}
       A.cheers.push({from_id:A.user.id,to_id:id,day:TODAY()});hud(r.sent?'🔥 Encouragement envoyé à '+nm:nm+' verra ton encouragement dans l’app')}
     catch(e){el.classList.remove('done');hud('Erreur : '+e.message)}break}
   case 'gateSkip':try{localStorage.setItem(AK,'local')}catch(e){}hideGate();if(!st().onboarded)showOnboard();break;
   case 'gateOpen':showGate('login');break;
   case 'groupMenu':if(!A.group)asheet('Groupe d’amis',[{label:'Créer un groupe',act:'groupCreate'},{label:'Rejoindre avec un code',act:'groupJoin'}]);
     else asheet(`${A.group.name} · code ${A.group.code}`,[{label:'Inviter un ami',act:'groupShare'},{label:'Quitter le groupe',act:'groupLeave',danger:true}]);break;
   case 'groupCreate':sheet('Nouveau groupe',`<form id="sf" data-form="gcreate">${sec('',`<label class="cell field" for="gn"><span>Nom</span><input id="gn" name="name" maxlength="40" placeholder="Les motivés"></label>`,'Un code d’invitation est créé : partage-le à tes amis.')}</form>`,{save:'Créer'});break;
   case 'groupJoin':sheet('Rejoindre un groupe',`<form id="sf" data-form="gjoin">${sec('',`<label class="cell field" for="gc"><span>Code</span><input id="gc" name="code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.15em"></label>`,'Le code à 6 caractères envoyé par ton ami.')}</form>`,{save:'Rejoindre'});break;
   case 'groupShare':shareCode();break;
   case 'groupLeave':asheet('Quitter le groupe ? Tu pourras le rejoindre avec son code.',[{label:'Quitter le groupe',act:'groupLeaveGo',danger:true}]);break;
   case 'groupLeaveGo':{if(needNet())break;const g=A.group;if(!g)break;
     const r=await sb.from('group_members').delete().eq('group_id',g.id).eq('user_id',A.user.id);
     if(r.error){hud('Erreur : '+r.error.message);break}
     if(g.owner===A.user.id&&A.members.length<=1)await sb.from('groups').delete().eq('id',g.id);
     A.group=null;A.members=[];A.shares=[];paintFriends();render();hud('Groupe quitté');break}
   case 'logout':asheet('Se déconnecter ? Les données quittent ce téléphone mais restent dans ton compte.',[{label:'Se déconnecter',act:'logoutGo',danger:true}]);break;
   case 'logoutGo':{if(A.dirty||A.flushing){const ok=await cloudFlush();if(!ok){hud('Hors ligne : connecte-toi au réseau d’abord');break}}
     try{await sb.auth.signOut()}catch(e){}
     A.user=null;A.group=null;A.members=[];A.shares=[];A.dirty=false;clearTimeout(A.t);
     db=seed();writeLocal();try{localStorage.removeItem(CK)}catch(e){}chat=[];S.tab='today';
     showHome(false);render();showGate('login','Déconnecté.');break}
   case 'askDeleteMe':asheet('Supprimer ton compte ? Tes données en ligne et ta place dans le groupe sont effacées. Action définitive.',[{label:'Supprimer mon compte',act:'deleteMeGo',danger:true}]);break;
   case 'deleteMeGo':{if(needNet())break;const r=await sb.rpc('delete_me');if(r.error){hud('Erreur : '+r.error.message);break}
     try{await sb.auth.signOut()}catch(e){}
     A.user=null;A.group=null;A.members=[];A.shares=[];A.dirty=false;clearTimeout(A.t);delete db.owner;writeLocal();try{localStorage.setItem(AK,'local')}catch(e){}
     render();paintFriends();hud('Compte supprimé');break}
  }});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset?.rd==null)return;const s=st();s.reading=s.reading||{on:false,label:'Lecture',min:10};const k=t.dataset.rd;
  if(k==='on')s.reading.on=t.checked;else if(k==='min'){s.reading.min=Math.max(1,Math.round(num(t.value)||10));t.value=s.reading.min}else s.reading.label=t.value.trim()||'Lecture';save()});
document.addEventListener('submit',async ev=>{const f=ev.target;const k=f.dataset?.form;if(!['auth','onboard','gcreate','gjoin'].includes(k))return;ev.preventDefault();
  if(k==='auth')return doAuth(f);
  if(k==='onboard')return doOnboard(f);
  if(needNet())return;const btn=document.querySelector('.sheet-h .strong');if(btn)btn.disabled=true;
  try{
    if(k==='gcreate'){await groupCreate(String(new FormData(f).get('name')||'').trim());closeSheet();await loadGroup(true);render();hud('Groupe créé · code '+A.group?.code)}
    if(k==='gjoin'){const code=String(new FormData(f).get('code')||'').trim().toUpperCase();if(code.length!==6){hud('Le code fait 6 caractères');if(btn)btn.disabled=false;return}
      const r=await sb.rpc('join_group',{invite:code});if(r.error)throw r.error;closeSheet();await loadGroup(true);render();hud('Bienvenue dans « '+(A.group?.name||'le groupe')+' »')}
  }catch(e){if(btn)btn.disabled=false;hud(/invalide/i.test(e?.message||'')?'Code invalide':'Erreur : '+(e?.message||e))}});
render();keepAwake();showHome(false);cloudBoot();
(function(){const first=$('#splash');if(!first)return;const HTML=first.outerHTML;let hiddenAt=0;
  function play(sp){const short=reduce();if(short)sp.classList.add('short');let done=false;
    const end=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.remove(),420)};
    sp.addEventListener('click',end);setTimeout(end,short?500:5600)}
  play(first);
  /* À chaque retour dans l'app (après l'avoir quittée), l'animation se rejoue. Pas pendant une séance ni une lecture chronométrée. */
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
    if(!hiddenAt||Date.now()-hiddenAt<1500||db.active||db.reading||$('#splash'))return;
    document.body.insertAdjacentHTML('afterbegin',HTML);play($('#splash'))});
  window.addEventListener('pageshow',e=>{if(e.persisted&&!$('#splash')&&!db.active&&!db.reading){document.body.insertAdjacentHTML('afterbegin',HTML);play($('#splash'))}});
})();
})();
</script>
