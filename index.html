<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luck’In"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>:root{color-scheme:light}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Luck’In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iOS-native inset grouped lists, large titles, blurred nav + tab bars, modal sheets. Single column, max 600px. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E3E3E8; --seg-on:#FFFFFF; --press:#D1D1D6;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --tint:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --bar:rgba(249,249,249,.84);
  --shadow:0 8px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --seg-on:#636366; --press:#3A3A3C;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --tint:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --bar:rgba(22,22,24,.84);
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --seg-on:#636366; --press:#3A3A3C;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --tint:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --bar:rgba(22,22,24,.84);
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:17px/1.35 var(--font);margin:0;touch-action:manipulation;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.l2{color:var(--label2)} .clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Nav bar */
.navbar{position:fixed;top:0;left:0;right:0;z-index:6;padding-top:env(safe-area-inset-top,0px);transition:background .2s}
.navbar .in{max-width:600px;margin:0 auto;height:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:6px;align-items:center;padding:0 8px}
.navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.navbar .ttl{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled .ttl{opacity:1}
.navbtn{color:var(--tint);font-size:17px;display:inline-flex;align-items:center;gap:2px;padding:8px;min-height:44px;max-width:100%}
.navbtn.strong{font-weight:600}
.navbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn svg{width:22px;height:22px;flex:none}
.navbar .r{justify-self:end}.navbar .l{justify-self:start;min-width:0}

/* Page */
main{max-width:600px;margin:0 auto;padding:44px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.lt{display:flex;flex-direction:column;gap:2px;padding:4px 4px 0}
.lt .eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
h1{font:700 34px/1.12 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h1.sm{font-size:28px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec-h{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px;display:flex;justify-content:space-between}
.sec-f{font-size:13px;color:var(--label2);padding:0 16px;line-height:1.4}
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.group.ic{--inset:56px}
.cell .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cell .sub{font-size:15px;color:var(--label2)}
.cell .fn{font-size:13px;color:var(--label2)}
.tap{cursor:pointer}
.tap:active{background:var(--press)}
.chev{flex:none;width:8px;height:13px;color:var(--label3)}
.acc{color:var(--label2);font-size:17px;white-space:nowrap}
.link{color:var(--tint)} .danger{color:var(--red)} .center{justify-content:center}
.plus{width:28px;height:28px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}
.plus svg{width:16px;height:16px}
.pill{font-size:13px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--fill);color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.pill.late{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.pill.tint{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:15px}

/* Today */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative}
.stats>div+div::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.stats .v{font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats .streak{display:flex;align-items:center;gap:4px}.stats .streak svg{width:22px;height:22px;flex:none}
@media (prefers-reduced-motion:no-preference){.stats .streak svg{transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}@keyframes flick{50%{transform:scale(1.06) rotate(-3deg)}}}
.stats .k{font-size:13px;color:var(--label2)}
.quote{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.quote .k{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.quote p{margin:0;font:600 20px/1.3 var(--display);text-wrap:balance}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);flex:none;display:grid;place-items:center;color:#fff}
.check svg{width:14px;height:14px;opacity:0}
.on .check{background:var(--tint);border-color:var(--tint)}
.on .check svg{opacity:1}
.on .ttx{color:var(--label2)}
@media (prefers-reduced-motion:no-preference){.on .check{animation:pop .25s ease-out}@keyframes pop{50%{transform:scale(1.18)}}}
.entry input{width:84px;text-align:right}
.okbtn{width:30px;height:30px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}
.okbtn svg{width:16px;height:16px}

/* Goal detail */
.summary{display:flex;align-items:center;gap:18px;padding:16px}
.summary .kv{flex:1;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;min-width:0}
.summary .kv span:nth-child(odd){color:var(--label2)}
.summary .kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ring text{font:700 17px var(--display);fill:var(--label)}
.smart{display:flex;gap:6px;flex-wrap:wrap}
.smart span{font-size:13px;font-weight:600;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--label3)}
.smart span.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.para{white-space:pre-wrap;font-size:17px}

/* Inputs inside cells */
.cell input:not([type=checkbox]):not([type=radio]),.cell select,.cell textarea{font:17px var(--font);color:var(--label);background:transparent;border:0;padding:0;min-width:0;outline:none;-webkit-appearance:none;appearance:none}
.cell input::placeholder,.cell textarea::placeholder{color:var(--label3)}
.cell.field>span{flex:none}
.cell.field input,.cell.field select{flex:1;text-align:right;color:var(--label2)}
.cell.field input:focus{color:var(--label)}
.cell.field select{direction:rtl}
.cell.block{flex-direction:column;align-items:stretch;gap:8px}
.cell.block>span{font-size:13px;color:var(--label2)}
.cell.block input,.cell.block textarea{width:100%}
.cell textarea{min-height:66px;resize:none;line-height:1.35}
.cell:focus-within{background:color-mix(in srgb,var(--fill) 45%,transparent)}
input[type=date]{min-height:22px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;width:100%}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:6px 2px;font-size:13px;font-weight:500;border-radius:7px;white-space:nowrap}
.seg input:checked+span{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.seg input:focus-visible+span{outline:2px solid var(--tint)}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.switch:checked{background:var(--green)}.switch:checked::before{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:28px;border-radius:8px;background:var(--fill);font-size:20px;line-height:1}
.stepper output{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}

/* Weight sliders */
.wbar{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;background:var(--card)}
.wbar span{display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;transition:flex-grow .15s}
.cell.block>.wrow{display:flex;justify-content:space-between;font-size:17px;color:var(--label)}
.wrow output{color:var(--label2)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--c) var(--p),var(--fill) var(--p))}
.range::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--c) var(--p),var(--fill) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12);border:0}
.range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12);border:0}

/* Coach chat */
main.chat{gap:10px;padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.msg{max-width:84%;padding:9px 14px;border-radius:19px;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--tint);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}.msg.a ul{margin:0 0 8px;padding-left:20px}.msg.a li{margin:2px 0}
.msg.err{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--label)}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:8px;height:8px;border-radius:50%;background:var(--label3)}
@media (prefers-reduced-motion:no-preference){.typing i{animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes blink{50%{opacity:.25}}}
.note{align-self:center;font-size:13px;color:var(--label2);text-align:center;padding:2px 12px}
.plan{align-self:stretch;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--sep)}
.plan .ph{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan .ph b{font:600 17px var(--display)}
.plan details{border-top:.5px solid var(--sep)}
.plan summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 16px}
.plan summary::-webkit-details-marker{display:none}
.plan .rank{width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.plan .tree{padding:0 16px 12px 50px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.plan .tree .lv{font-weight:600;margin-top:4px}.plan .tree .ac{color:var(--label2);padding-left:12px}
.plan .pa{padding:10px 16px 14px;border-top:.5px solid var(--sep)}
.btn-fill{width:100%;min-height:50px;border-radius:12px;background:var(--tint);color:#fff;font-weight:600;font-size:17px}
.btn-fill:disabled{background:var(--fill);color:var(--label2)}
.chips{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.chip-s{background:var(--card);color:var(--tint);border-radius:18px;padding:9px 14px;font-size:15px;text-align:right;max-width:90%}
.composer{position:fixed;left:0;right:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.composer .in{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 12px}
.composer textarea{flex:1;min-height:36px;max-height:140px;resize:none;border-radius:18px;border:1px solid var(--sep);background:var(--card);color:var(--label);font:17px/1.3 var(--font);padding:7px 14px;outline:none}
.send{width:34px;height:34px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:1px}
.send:disabled{background:var(--fill);color:var(--label3)}
.send svg{width:18px;height:18px}
.setup{display:flex;flex-direction:column;gap:14px;padding:18px 16px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10px;font-weight:500;color:#8E8E93;letter-spacing:.01em}
.tabs button[aria-current="page"]{color:var(--tint)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:94%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;overflow:hidden}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:none}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;flex:none}
.sheet-h h2{font-size:17px;font-weight:600;margin:0;text-align:center}
.sheet-h .r{justify-self:end}
.sheet-b{overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.sheet-b form{display:flex;flex-direction:column;gap:22px}
.asheet{background:transparent;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;display:flex;flex-direction:column}
.asheet .group{border-radius:14px;background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.asheet .cell{justify-content:center;font-size:20px;color:var(--tint);min-height:57px}
.asheet .cap{font-size:13px;color:var(--label2);text-align:center;padding:14px 16px;justify-content:center}
.asheet .cancel{font-weight:600;background:var(--card)}
@media (prefers-reduced-motion:no-preference){
  .scrim{animation:fade .25s ease}.sheet,.asheet{animation:up .35s cubic-bezier(.32,.72,0,1)}
  .scrim.out{animation:fadeo .22s ease forwards}.scrim.out .sheet,.scrim.out .asheet{animation:down .22s ease-in forwards}
  main.push{animation:push .32s cubic-bezier(.32,.72,0,1)} main.pop{animation:popb .32s cubic-bezier(.32,.72,0,1)}
  @keyframes fade{from{background:transparent}} @keyframes fadeo{to{background:transparent}}
  @keyframes up{from{transform:translateY(100%)}} @keyframes down{to{transform:translateY(100%)}}
  @keyframes push{from{transform:translateX(28%);opacity:.3}} @keyframes popb{from{transform:translateX(-18%);opacity:.3}}
}
.hud{pointer-events:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);z-index:20;background:var(--card);color:var(--label);box-shadow:var(--shadow);padding:10px 18px;border-radius:99px;font-size:15px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
svg.chart text{fill:var(--label2);font:500 11px var(--font);font-variant-numeric:tabular-nums}

/* ---------- Cap Forme additions ---------- */
.tabs .in{grid-template-columns:repeat(5,1fr)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.state{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--label3);color:#fff}
.state svg{width:13px;height:13px}
.state.ok{background:var(--green);border-color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpis>div{padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.kpis>div+div::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.kpis .v{font:600 19px/1.1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis .k{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis .bar{height:4px;border-radius:2px;background:var(--fill);margin-top:4px;overflow:hidden}
.kpis .bar i{display:block;height:100%;background:var(--tint);border-radius:2px}
.foods{display:flex;flex-wrap:wrap;gap:6px}
.foods button{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--fill);color:var(--label)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles label{position:relative;cursor:pointer}
.toggles input{position:absolute;opacity:0;pointer-events:none}
.toggles span{display:block;padding:7px 12px;border-radius:99px;background:var(--fill);font-size:15px}
.toggles input:checked+span{background:var(--tint);color:#fff}
.toggles input:focus-visible+span{outline:2px solid var(--tint);outline-offset:2px}
.sub-block{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--label2)}
.mini input{font:16px var(--font);color:var(--label);background:var(--card);border:0;border-radius:8px;padding:7px 9px;width:100%;min-width:0;outline:none}
.mini.three{grid-template-columns:1fr 1fr 1fr}
.cell.field input.wide{max-width:none}
/* workout */
.exh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px}
.exh .n{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.exh.done .n{background:var(--green);color:#fff}
.exh.cur .n{background:var(--tint);color:#fff}
.sets{display:flex;flex-direction:column;padding:0 16px 4px}
.setrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:.5px solid var(--sep);font-size:16px;font-variant-numeric:tabular-nums;text-align:left;width:100%}
.setrow .i{color:var(--label2);font-size:13px}
.logger{display:flex;flex-direction:column;gap:10px;padding:10px 16px 14px;border-top:.5px solid var(--sep)}
.logger .lbl{font-size:12px;color:var(--label2)}
.inrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numbox{display:flex;align-items:center;background:var(--bg);border-radius:10px;overflow:hidden}
.numbox button{width:40px;height:44px;font-size:20px;color:var(--tint);flex:none}
.numbox input{flex:1;min-width:0;text-align:center;font:600 20px var(--display);background:transparent;border:0;color:var(--label);outline:none;font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--label2)}
.rest-btn{color:var(--tint);font-size:15px;font-weight:500}
.timer{position:fixed;left:0;right:0;z-index:6;padding:0 10px 8px;pointer-events:none}
.timer .in{max-width:580px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto;position:relative;overflow:hidden}
.timer .t{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;min-width:96px}
.timer .lab{font-size:13px;color:var(--label2);flex:1;min-width:0}
.timer .lab b{display:block;color:var(--label);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .pb{position:absolute;left:0;bottom:0;height:4px;background:var(--tint)}
.timer button{width:44px;height:36px;border-radius:10px;background:var(--fill);font-size:14px;font-weight:600;flex:none}
.timer.end .in{background:var(--green);color:#fff}.timer.end .lab,.timer.end .lab b{color:#fff}.timer.end button{background:rgba(255,255,255,.25);color:#fff}
@media (prefers-reduced-motion:no-preference){.timer.end .in{animation:pulse 1s ease-in-out 3}@keyframes pulse{50%{transform:scale(1.03)}}}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.elapsed{font:600 17px var(--display);font-variant-numeric:tabular-nums;color:var(--tint)}
.tbl{display:grid;grid-template-columns:1fr auto auto;gap:0}
.tbl>*{padding:9px 16px;border-top:.5px solid var(--sep);font-size:15px}
.tbl>*:nth-child(-n+3){border-top:0}
.tbl .h{font-size:12px;color:var(--label2);text-transform:uppercase}
.legend{display:flex;gap:14px;padding:0 16px 10px;font-size:12px;color:var(--label2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lt.wk-head{flex-direction:row}
.inrow>div{min-width:0}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sflame{display:inline-flex;align-items:center;gap:3px;padding:5px 11px 5px 8px;border-radius:99px;background:var(--fill);color:var(--label3);font:700 20px/1 var(--display);flex:none}
.sflame svg{width:24px;height:24px}
.sflame.on{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.sflame.on span{color:var(--label)}
@media (prefers-reduced-motion:no-preference){.sflame.on svg{transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}@keyframes flick{50%{transform:scale(1.07) rotate(-3deg)}}}
.timer.work .in{background:var(--tint);color:#fff}.timer.work .lab,.timer.work .lab b{color:#fff}.timer.work button{background:rgba(255,255,255,.22);color:#fff}.timer.work .pb{background:#fff}

/* Accueil : fond blanc cassé fixe, cercles pleins à mouvement irrégulier */
#home{position:fixed;inset:0;z-index:40;background:#F3F1EC;color:#1D1D1F;color-scheme:light;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.h-top{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:340px}
.h-name{font:600 30px/1.1 var(--display);letter-spacing:-.01em}
.h-quote{margin:0;display:flex;flex-direction:column;gap:10px}
.h-quote p{margin:0;font:italic 400 19px/1.45 ui-serif,"New York",Georgia,"Times New Roman",serif;color:#3A3A3C;text-wrap:balance}
.h-quote cite{font:600 11px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:#8E8E93;font-style:normal}
#bloom{position:fixed;z-index:45;border-radius:50%;pointer-events:none}
#area{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 40px}
.a-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.a-head{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.a-dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);margin-bottom:8px}
.a-bul{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.homebtn .hb{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;flex:none}


/* Barre d'onglets flottante en pilule */
:root{--pill-bg:rgba(255,255,255,.82);--pill-fg:#3A3A3C;--pill-on:rgba(0,0,0,.08);--pill-on-fg:#000;--pill-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pill-bg:rgba(40,40,44,.82);--pill-fg:rgba(255,255,255,.88);--pill-on:rgba(255,255,255,.18);--pill-on-fg:#fff;--pill-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--pill-bg:rgba(40,40,44,.82);--pill-fg:rgba(255,255,255,.88);--pill-on:rgba(255,255,255,.18);--pill-on-fg:#fff;--pill-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.08)}
.tabs{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px;border-radius:999px;background:var(--pill-bg);box-shadow:var(--pill-shadow);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.tabs .in{gap:4px}
.tabs button{font-size:0;letter-spacing:0;gap:0;padding:12px 0;border-radius:999px;color:var(--pill-fg);transition:background .2s,color .2s}
.tabs button[aria-current="page"]{background:var(--pill-on);color:var(--pill-on-fg)}
.tabs svg{width:27px;height:27px;stroke-width:2}
main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
main.chat{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.composer{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 16px);max-width:600px;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.composer textarea{box-shadow:var(--pill-shadow)}

/* Fond de la couleur pleine de la section ouverte */
:root.tinted body{background:var(--area)}
:root.tinted main>.lt,:root.tinted main>.lt h1,:root.tinted .navbar .ttl,:root.tinted .navbar .navbtn,:root.tinted .elapsed,:root.tinted main>.note,:root.tinted main>.note.link{color:#fff}
:root.tinted main>.lt .eyebrow{color:rgba(255,255,255,.82)}
:root.tinted main .sec-h,:root.tinted main .sec-h .link{color:rgba(255,255,255,.9)}
:root.tinted main .sec-f{color:rgba(255,255,255,.85)}
:root.tinted .navbar.scrolled{background:color-mix(in srgb,var(--area) 88%,transparent);box-shadow:0 .5px 0 rgba(255,255,255,.25)}
#area{background:var(--area);color:#fff}
#area .a-head .l2,#area .navbtn{color:#fff}
#area .a-dot{border-color:#fff;background:rgba(255,255,255,.25)}


/* Cartes en verre dépoli intégrées au fond de couleur */
:root.tinted main,:root.tinted #area{--card:rgba(255,255,255,.2);--bg:rgba(255,255,255,.16);--fill:rgba(255,255,255,.22);--press:rgba(255,255,255,.12);--seg-on:rgba(255,255,255,.95);
  --label:#fff;--label2:rgba(255,255,255,.8);--label3:rgba(255,255,255,.55);--sep:rgba(255,255,255,.3);--tint:#fff;color:#fff}
:root.tinted main .group,:root.tinted #area .group{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
:root.tinted main .plus,:root.tinted main .okbtn,:root.tinted main .btn-fill,:root.tinted main .on .check,:root.tinted main .send{color:var(--area)}
:root.tinted main .seg input:checked+span{color:var(--area)}
:root.tinted main .msg.u{color:var(--area)}

:root.tinted #area .a-bul{background:#fff}
:root.tinted main .exh.cur .n{color:var(--area)}

/* Glassmorphism : fond de couleur avec halos flous, panneaux en verre */
:root.tinted body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(38% 30% at 18% 18%,color-mix(in srgb,var(--area) 55%,#fff) 0,transparent 70%),
   radial-gradient(42% 34% at 88% 38%,color-mix(in srgb,var(--area) 60%,#FF2D55) 0,transparent 70%),
   radial-gradient(46% 36% at 22% 82%,color-mix(in srgb,var(--area) 55%,#FFD60A) 0,transparent 70%),
   radial-gradient(40% 30% at 80% 92%,color-mix(in srgb,var(--area) 70%,#000) 0,transparent 70%),
   var(--area)}
@media (prefers-reduced-motion:no-preference){:root.tinted body::before{animation:drift 24s ease-in-out infinite alternate}@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05) rotate(2deg)}}}
:root.tinted main .group,:root.tinted #area .group{background:rgba(255,255,255,.16);border-radius:20px;
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.38);box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.35)}
:root.tinted main .group .group{border:0;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
:root.tinted .tabs{--pill-bg:rgba(255,255,255,.18);--pill-fg:#fff;--pill-on:rgba(255,255,255,.35);--pill-on-fg:#fff;
  border:1px solid rgba(255,255,255,.38);box-shadow:0 10px 32px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35)}
:root.tinted .navbar.scrolled{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:0 .5px 0 rgba(255,255,255,.35)}
:root.tinted main .sflame{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:rgba(255,255,255,.7)}
:root.tinted .timer .in{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
:root.tinted .timer .lab,:root.tinted .timer .lab b{color:#fff}:root.tinted .timer button{background:rgba(255,255,255,.25);color:#fff}

#area{background:radial-gradient(38% 30% at 18% 18%,color-mix(in srgb,var(--area) 55%,#fff) 0,transparent 70%),
   radial-gradient(42% 34% at 88% 38%,color-mix(in srgb,var(--area) 60%,#FF2D55) 0,transparent 70%),
   radial-gradient(46% 36% at 22% 82%,color-mix(in srgb,var(--area) 55%,#FFD60A) 0,transparent 70%),
   radial-gradient(40% 30% at 80% 92%,color-mix(in srgb,var(--area) 70%,#000) 0,transparent 70%),
   var(--area);background-attachment:fixed}
:root.tinted main .acc,:root.tinted main .stats .v,:root.tinted main .kpis .v{color:#fff!important;font-weight:600}

/* Fond neutre (noir ou blanc selon le téléphone), barre d'onglets à la couleur de la section */
:root.in-area .tabs{--pill-bg:var(--area);--pill-fg:rgba(255,255,255,.82);--pill-on:rgba(255,255,255,.3);--pill-on-fg:#fff;box-shadow:0 10px 28px color-mix(in srgb,var(--area) 45%,transparent)}
#area{background:var(--bg);color:var(--label)}
#area .a-head .l2{color:var(--label2)}#area .navbtn{color:var(--tint)}
#area .a-dot{border:0;background:var(--c)}#area .a-bul{background:var(--c)}
.navbar .r .sflame{font-size:17px;padding:4px 10px 4px 7px;margin-right:8px}.navbar .r .sflame svg{width:20px;height:20px}
main>.group:first-child{margin-top:8px}

/* Barre de section : couleur adoucie */
:root.in-area .tabs{--pill-bg:color-mix(in srgb,var(--area) 22%,rgba(255,255,255,.9));--pill-fg:color-mix(in srgb,var(--area) 75%,#000);--pill-on:color-mix(in srgb,var(--area) 30%,transparent);--pill-on-fg:color-mix(in srgb,var(--area) 85%,#000);box-shadow:0 8px 24px color-mix(in srgb,var(--area) 18%,transparent),0 0 0 .5px color-mix(in srgb,var(--area) 30%,transparent)}
@media (prefers-color-scheme: dark){:root.in-area:not([data-theme="light"]) .tabs{--pill-bg:color-mix(in srgb,var(--area) 30%,rgba(28,28,30,.92));--pill-fg:rgba(255,255,255,.75);--pill-on:color-mix(in srgb,var(--area) 45%,transparent);--pill-on-fg:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 .5px color-mix(in srgb,var(--area) 35%,transparent)}}

/* Icônes de la barre plus prononcées */
.tabs svg{width:29px;height:29px;stroke-width:2.5}
.tabs button[aria-current="page"] svg{stroke-width:2.8}
:root.in-area .tabs{--pill-fg:color-mix(in srgb,var(--area) 60%,#000);--pill-on-fg:color-mix(in srgb,var(--area) 55%,#000)}
@media (prefers-color-scheme: dark){:root.in-area:not([data-theme="light"]) .tabs{--pill-fg:#fff;--pill-on-fg:#fff}}
:root.in-area[data-theme="dark"] .tabs{--pill-fg:#fff;--pill-on-fg:#fff}

/* Icônes de barre : contour arrondi, version pleine pour l'onglet actif, avatar pour Réglages */
.tabs svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"] svg{stroke-width:2.2}
.tabs svg .fill{fill:currentColor}
.tabs .f{display:none}.tabs button[aria-current="page"] .f{display:block}.tabs button[aria-current="page"] .o{display:none}
.tabs .av{width:30px;height:30px;stroke:none}
.tabs .av .ring{fill:none;stroke:transparent;stroke-width:1.6}
.tabs .av .disc{fill:var(--area,#8E8E93)}
.tabs .av .ini{fill:#fff;font:700 10px var(--display);stroke:none}
.tabs .avatar-tab[aria-current="page"] .ring{stroke:currentColor}

/* Glassmorphism sur fond neutre : halos diffus de la couleur de section + panneaux en verre */
:root{--glass:rgba(255,255,255,.55);--glass-line:rgba(255,255,255,.75);--glass-shadow:0 8px 30px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(30,30,32,.5);--glass-line:rgba(255,255,255,.1);--glass-shadow:0 8px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--glass:rgba(30,30,32,.5);--glass-line:rgba(255,255,255,.1);--glass-shadow:0 8px 30px rgba(0,0,0,.45)}
:root.in-area body::before{content:"";position:fixed;inset:-8%;z-index:-1;pointer-events:none;background:radial-gradient(55% 38% at 12% 8%,color-mix(in srgb,var(--area) 38%,transparent) 0,transparent 72%),
   radial-gradient(50% 34% at 92% 46%,color-mix(in srgb,var(--area) 28%,transparent) 0,transparent 72%),

@media (prefers-color-scheme: dark){:root.in-area:not([data-theme="light"]) body::before{background:radial-gradient(55% 38% at 12% 8%,color-mix(in srgb,var(--area) 46%,transparent) 0,transparent 72%),
   radial-gradient(50% 34% at 92% 46%,color-mix(in srgb,var(--area) 34%,transparent) 0,transparent 72%),

@media (prefers-reduced-motion:no-preference){:root.in-area body::before{animation:drift 26s ease-in-out infinite alternate}}
:root.in-area main .group{background:var(--glass);border-radius:20px;border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
:root.in-area main .group .group{border:0;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0}
:root.in-area .tabs{--pill-bg:color-mix(in srgb,var(--area) 16%,var(--glass));border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
@media (prefers-color-scheme: dark){:root.in-area:not([data-theme="light"]) .tabs{--pill-bg:color-mix(in srgb,var(--area) 24%,var(--glass))}}
:root.in-area .navbar .sflame{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
:root.in-area .navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}

/* Raccord invisible avec la barre d'état de l'iPhone : le haut de l'écran reste uni, les halos apparaissent plus bas */
:root.in-area body::before{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 220px);mask-image:linear-gradient(to bottom,transparent 0,#000 220px)}
@media (prefers-color-scheme: light){body{background:linear-gradient(#fff 0,#fff 60px,var(--bg) 240px) fixed,var(--bg)}}
:root[data-theme="light"] body{background:linear-gradient(#fff 0,#fff 60px,var(--bg) 240px) fixed,var(--bg)}

/* Le contenu défile sous la barre d'état : rien n'est figé en haut */
.navbar{position:absolute}
.navbar.scrolled{background:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.navbar .ttl{visibility:hidden}
main{padding-top:calc(44px + env(safe-area-inset-top,0px))}
/* Mode clair : l'heure de l'iPhone est écrite en blanc (barre d'état translucide). Voile très progressif pour la garder lisible, sans bord visible. */
@media (prefers-color-scheme: light){body::after{content:"";position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 64px);pointer-events:none;z-index:50;
  background:linear-gradient(to bottom,rgba(0,0,0,.16) 0,rgba(0,0,0,.13) calc(env(safe-area-inset-top,0px)*.5),rgba(0,0,0,.08) env(safe-area-inset-top,0px),rgba(0,0,0,.03) calc(env(safe-area-inset-top,0px) + 32px),rgba(0,0,0,0) 100%)}}

/* Interface allégée : blocs détachés, sans sous-titres sous les rituels */
.rituals .fn{display:none}
.rituals .cell{min-height:58px}
.group.tiles{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:0!important;overflow:visible;display:flex;flex-direction:column;gap:10px}

/* 0 → 0,3 s : la chaise se dessine, buste penché en arrière */

.br-add label{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--fill);color:var(--label);cursor:pointer}
.br .a-head .br-back{align-self:flex-start;padding:0;margin-bottom:6px;font-size:15px;color:var(--area);background:none;border:0}
.br-title{word-break:break-word}
.br-text{display:block!important;font-size:17px;line-height:1.5}
.br-text p{margin:0 0 .6em}.br-text p:last-child{margin-bottom:0}
.br-text ul{margin:0 0 .6em;padding-left:1.2em}
.br-text a{color:var(--area);word-break:break-all}
.br-ln{display:inline;padding:0 4px;margin:0 1px;border:0;border-radius:6px;font:inherit;color:var(--area);background:color-mix(in srgb,var(--area) 14%,transparent);cursor:pointer}
.br-ln.new{background:none;text-decoration:underline dashed;color:var(--label2)}
.br-media{display:flex;flex-direction:column;gap:12px}
.br-m{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;overflow:hidden}
.br-m img,.br-m video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
.br-img{min-height:120px;background:var(--fill)}
.br-m audio{display:block;width:100%;padding:10px;box-sizing:border-box}
.br-mf{display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.br-mf .link,.br .cell .link{background:none;border:0;color:var(--red);font:inherit;font-size:14px;cursor:pointer;padding:0}
.br-rec{flex-direction:column!important;align-items:center!important;gap:14px;padding:24px 16px!important}
.br-rt{font:600 34px var(--display);font-variant-numeric:tabular-nums}
.br-rb{width:72px;height:72px;border-radius:50%;border:4px solid var(--label3);background:var(--red);cursor:pointer;transition:border-radius .2s,transform .2s}
.br-rb.on{border-radius:14px;transform:scale(.7)}
/* Apprentissage : barre d'outils d'écriture, menu d'insertion, médias dans le texte */
.br-tools{display:flex!important;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.br-tools::-webkit-scrollbar{display:none}
.br-tools button,.br-tools label{flex:none;font-size:13px;padding:6px 11px;border-radius:99px;background:var(--fill);color:var(--label);cursor:pointer;white-space:nowrap;border:0;font-family:inherit}
#brb{min-height:200px}
.br-pop-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.25)}
.br-pop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:71;width:calc(100% - 32px);max-width:420px;max-height:70vh;overflow:auto;
  background:var(--card);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:6px}
.br-pop>button,.br-pop>label,.br-pl>button{display:block;width:100%;text-align:left;padding:13px 14px;border:0;background:none;color:var(--label);font:17px var(--font);border-radius:12px;cursor:pointer}
.br-pop>button:active,.br-pop>label:active,.br-pl>button:active{background:var(--fill)}
.br-pq{margin:6px;padding:11px 12px;border-radius:12px;border:0;background:var(--fill);color:var(--label);font:17px var(--font);outline:none}
.br-pl{max-height:45vh;overflow:auto}
.br-text h3{font:700 19px/1.3 var(--display);margin:.8em 0 .4em}
.br-text h3:first-child{margin-top:0}
.br-inl{margin:.6em 0;border-radius:14px}
/* Carrière › Événements et Apprentissage : sélecteur en haut de page */
.ev-seg{padding:0 2px}
.ev-seg .seg{background:var(--glass);border:1px solid var(--glass-line)}
.ev-seg .seg span{padding:8px 2px;font-size:14px}
/* Apprentissage : carte des connexions */
.br-graph{position:relative;background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;overflow:hidden;box-shadow:var(--glass-shadow)}
#brgs{display:block;width:100%;height:62vh;touch-action:none;user-select:none;-webkit-user-select:none}
.br-ge line{stroke:var(--label3);stroke-width:1.5;opacity:.7;vector-effect:non-scaling-stroke}
.br-gn{cursor:pointer}
.br-gn .hit{fill:transparent}
.br-gn circle:not(.hit){fill:var(--area);stroke:var(--card);stroke-width:2;vector-effect:non-scaling-stroke}
.br-gn.ghost circle:not(.hit){fill:var(--card);stroke:var(--label3);stroke-dasharray:3 3}
.br-gn text{font:600 13px var(--font);fill:var(--label);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.br-gn.ghost text{fill:var(--label2);font-weight:500}
.br-gfit{position:absolute;top:10px;right:10px;font:600 13px var(--font);padding:6px 11px;border-radius:99px;border:0;background:var(--fill);color:var(--label);cursor:pointer}
</style>

const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};

/* ================= logic ================= */
const HAND={p:{k:120,pr:24},c:{k:110,pr:3},f:{k:100,pr:0},v:{k:25,pr:2}};
function mealKcal(m){if(m.kcal!=null)return m.kcal;if(m.hands)return sum(Object.keys(HAND).map(k=>(m.hands[k]||0)*HAND[k].k));return null}
function mealProt(m){if(m.prot!=null)return m.prot;if(m.hands)return sum(Object.keys(HAND).map(k=>(m.hands[k]||0)*HAND[k].pr));return null}
function totals(d){const ms=peekDay(d).meals;const k=ms.map(mealKcal).filter(x=>x!=null),p=ms.map(mealProt).filter(x=>x!=null);
  return {kcal:k.length?sum(k):null,prot:p.length?sum(p):null,off:ms.filter(m=>m.source&&m.source!=='maison').length,n:ms.length}}
const morningDone=d=>{const m=peekDay(d).morning;return !!(m&&(m.weight!=null||m.sleepH!=null))};
const eveningDone=d=>!!peekDay(d).evening?.done;
const isTrainingDay=d=>st().trainingDays.includes(dow(d));
const workoutsOn=d=>db.workouts.filter(w=>w.date===d&&w.end);
function weightSeries(){return Object.keys(db.days).sort().map(d=>({d,v:db.days[d].morning?.weight})).filter(x=>x.v!=null)}
function movAvg(series,n=7){return series.map(p=>{const from=addDays(p.d,-(n-1));const w=series.filter(q=>q.d>=from&&q.d<=p.d);return {d:p.d,v:avg(w.map(q=>q.v))}})}
function lastWeightAvg(ref=TODAY()){const s=weightSeries().filter(p=>p.d<=ref&&p.d>addDays(ref,-7));return avg(s.map(p=>p.v))}
function lastPerf(name,excludeId){for(let i=db.workouts.length-1;i>=0;i--){const w=db.workouts[i];if(w.id===excludeId||!w.end||w.kind!=='muscu')continue;const e=w.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e&&e.logged.length)return {date:w.date,sets:e.logged}}return null}
function timedSecs(e){const m=String(e?.reps||'').trim().match(/^(\d+(?:[.,]\d+)?)\s*(s|sec|secondes?|min|mn)\b/i);if(!m)return null;const n=num(m[1]);return /^m/i.test(m[2])?Math.round(n*60):Math.round(n)}
const setTxt=s=>s.secs!=null?`${s.secs} s${s.load?' · '+fmt(s.load)+' kg':''}`:`${s.load!=null?fmt(s.load):'PDC'}×${s.reps}`;
const e1rm=(l,r)=>l&&r?l*(1+r/30):null;
const hasSugar=d=>{const D=peekDay(d);return D.meals.some(m=>m.sugar)||!!D.evening?.sugarExtra};
const sugarFree=d=>eveningDone(d)&&!hasSugar(d);
function sugarStreak(){const t=TODAY();if(hasSugar(t))return 0;let d=eveningDone(t)?t:addDays(t,-1);let n=0;while(sugarFree(d)&&n<9999){n++;d=addDays(d,-1)}return n}
function sugarBest(){const ds=Object.keys(db.days).sort();if(!ds.length)return 0;let best=0,cur=0,d=ds[0];const end=TODAY();while(d<=end){if(sugarFree(d)){cur++;best=Math.max(best,cur)}else if(d!==end)cur=0;d=addDays(d,1)}return best}
const FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.5 2c.4 3-1.3 4.8-2.8 6.4C8.1 10.1 6.5 11.8 6.5 14.6 6.5 18.7 9 22 12.6 22c3.7 0 6-2.8 6-6.6 0-2.9-1.4-4.7-2.5-6-.2 1.5-.8 2.6-1.8 3.2.3-3.6-.4-7.6-1.8-10.6Z"/></svg>';
function streak(){let d=TODAY();if(!morningDone(d)&&!eveningDone(d))d=addDays(d,-1);let n=0;while((morningDone(d)||eveningDone(d))&&n<999){n++;d=addDays(d,-1)}return n}
function weekStats(ref){
  const ws=weekStart(ref),days=Array.from({length:7},(_,k)=>addDays(ws,k)).filter(d=>d<=TODAY());
  const meals=days.flatMap(d=>peekDay(d).meals);
  const pt=st().protTarget;
  return {ws,days:days.length,morning:days.filter(morningDone).length,evening:days.filter(eveningDone).length,
    sessions:db.workouts.filter(w=>w.end&&w.date>=ws&&w.date<=addDays(ws,6)).length,planned:st().trainingDays.length,
    meals:meals.length,home:meals.filter(m=>m.source==='maison').length,
    protHit:pt?days.filter(d=>(totals(d).prot||0)>=pt*0.9).length:null,
    wAvg:avg(days.map(d=>peekDay(d).morning?.weight)),wPrev:avg(Array.from({length:7},(_,k)=>peekDay(addDays(ws,k-7)).morning?.weight)),
    alcohol:sum(days.map(d=>peekDay(d).evening?.alcohol||0))};
}

/* ================= charts ================= */
function lineChart({series,target,h=170,fmtY=v=>fmt(v)}){
  const all=series.flatMap(s=>s.pts);if(!all.length)return '<div class="cell l2" style="font-size:15px">Pas encore de données.</div>';
  const ds=all.map(p=>p.d).sort();const d0=ds[0],d1=ds[ds.length-1],span=Math.max(1,diff(d0,d1));
  const vals=all.map(p=>p.v).concat(target!=null?[target]:[]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
  const W=340,l=40,r=14,tp=14,b=24,X=d=>l+diff(d0,d)/span*(W-l-r),Y=v=>tp+(hi-v)/(hi-lo)*(h-tp-b);
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  return `<div style="padding:4px 12px 8px"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img">
   ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${fmtY(v)}</text>`).join('')}
   ${target!=null?`<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-r}" y="${Y(target)-5}" text-anchor="end" style="fill:var(--green)">cible ${fmtY(target)}</text>`:''}
   ${series.map(s=>{const pts=s.pts.map(p=>`${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`);const last=s.pts[s.pts.length-1];
     return (s.dots?s.pts.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="${s.color}" opacity="${s.op||1}"/>`).join(''):'')+
       (s.line!==false&&pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.op||1}"/>`:'')+
       (s.end&&last?`<circle cx="${X(last.d)}" cy="${Y(last.v)}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`:'')}).join('')}
   <text x="${l}" y="${h-6}">${fdate(d0)}</text><text x="${W-r}" y="${h-6}" text-anchor="end">${fdate(d1)}</text></svg></div>`}
function barChart({days,vals,target,color='var(--tint)',h=130,fmtV=v=>fmt(v,0)}){
  const mx=Math.max(target||0,...vals.map(v=>v||0))*1.1||1;const W=340,l=34,r=6,tp=12,b=22,bw=(W-l-r)/days.length;const Y=v=>h-b-(v/mx)*(h-tp-b);
  return `<div style="padding:10px 12px 8px"><svg class="chart" viewBox="0 0 ${W} ${h}" width="100%" role="img">
   <line x1="${l}" x2="${W-r}" y1="${h-b}" y2="${h-b}" stroke="var(--sep)"/><text x="${l-5}" y="${tp+4}" text-anchor="end">${fmtV(mx/1.1)}</text><text x="${l-5}" y="${h-b}" text-anchor="end">0</text>
   ${vals.map((v,k)=>v?`<rect x="${(l+k*bw+2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(h-b-Y(v)).toFixed(1)}" rx="3" fill="${color}" opacity="${k===vals.length-1?1:.55}"/>`:'').join('')}
   ${target?`<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>`:''}
   <text x="${l+2}" y="${h-5}">${fdate(days[0])}</text><text x="${W-r}" y="${h-5}" text-anchor="end">${fdate(days[days.length-1])}</text></svg></div>`}

function splitProg(t){const i=t.indexOf('<programme>');if(i<0)return {text:t,prog:null,pending:false};const j=t.indexOf('</programme>',i);

  try{prog=JSON.parse(t.slice(i+11,j).trim().replace(/^```(json)?/,'').replace(/```$/,''));if(!Array.isArray(prog.templates))prog=null}catch(e){prog='bad'}
  return {text:(t.slice(0,i)+t.slice(j+12)).trim(),prog,pending:false}}
function md(t){const lines=esc(t).split('\n');let html='',list=false;

  if(list)html+='</ul>';return html}

   <div id="live"${C.busy?'':' hidden'}>${C.busy?liveHTML():''}</div>

function liveHTML(){const p=splitProg(C.live);if(!C.live)return `<div class="msg a"><span class="typing"><i></i><i></i><i></i></span></div>`;
  return (p.text?`<div class="msg a">${md(p.text)}</div>`:'')+(p.pending?`<div class="note">Préparation du programme…</div>`:'')}

const errCopy={not_granted:'Accès refusé : autorise le coach à utiliser Claude pour continuer.',rate_limited:'Trop de demandes pour le moment. Réessaie dans un instant.',session_expired:'Reconnecte-toi à Claude puis réessaie.',refused:'Le coach n’a pas pu répondre à ce message. Reformule-le.',prompt_too_large:'La conversation est trop longue. Démarre une nouvelle conversation.',sampling_disabled:'Claude n’est pas disponible pour ce compte.'};
async function callApi(turns,signal,onText){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':st().apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:st().model||'claude-sonnet-5-5',max_tokens:6000,stream:true,system:rules(),messages:turns})});
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw {code:'api',message:r.status===401?'Clé API invalide. Vérifie-la dans Réglages.':r.status===429?'Limite de requêtes atteinte. Réessaie dans un instant.':/credit/i.test(m)?'Crédit API épuisé : recharge ton compte sur console.anthropic.com.':'Erreur du service ('+r.status+') '+m}}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop();
    for(const ln of parts){if(!ln.startsWith('data:'))continue;let ev;try{ev=JSON.parse(ln.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta?.type==='text_delta'){text+=ev.delta.text;onText(text)}if(ev.type==='error')throw {code:'api',message:ev.error?.message||'Erreur du service'}}}
  return text;
}
async function send(text){
  text=text.trim();if(!text||C.busy)return;const ci=$('#cin');if(ci)ci.value='';
  chat.push({role:'user',content:text});saveChat();C.busy=true;C.live='';C.ctl=new AbortController();render();window.scrollTo(0,document.body.scrollHeight);
  const turns=chat.filter(m=>!m.err).slice(-20).map(m=>({role:m.role,content:m.content}));while(turns.length&&turns[0].role!=='user')turns.shift();
  try{let out;
    if(backend()==='claude'){const r=await C.sample([{role:'user',content:rules()+'\n\n---\nLa conversation commence ci-dessous.'},...turns],{cache:false,signal:C.ctl.signal,onText:({text})=>{C.live=text;paintLive()}});out=r.text}
    else out=await callApi(turns,C.ctl.signal,t=>{C.live=t;paintLive()});
    chat.push({role:'assistant',content:out});
  }catch(e){const partial=e?.text||C.live;
    if(e?.code==='cancelled'||e?.name==='AbortError'){if(partial)chat.push({role:'assistant',content:partial})}
    else{if(partial&&e?.code!=='refused')chat.push({role:'assistant',content:partial});chat.push({role:'assistant',err:true,content:errCopy[e?.code]||e?.message||'La connexion a échoué. Vérifie ta connexion et réessaie.'})}}
  C.busy=false;C.live='';saveChat();render();window.scrollTo(0,document.body.scrollHeight);
}

let actx=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){if(!st().sound||!actx)return;try{[0,.28,.56].forEach((o,k)=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=k===2?1320:880;os.connect(g);g.connect(actx.destination);const t0=actx.currentTime+o;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.22);os.start(t0);os.stop(t0+.24)})}catch(e){}}
const haptic=(p=10)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function startTimer(secs,label,extra={}){if(!db.active)return;db.active.timer=Object.assign({kind:'rest',end:Date.now()+secs*1000,total:secs,label,fired:false},extra);save();paintTimer()}
function shortBeep(f=660){if(!st().sound||!actx)return;try{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=f;os.connect(g);g.connect(actx.destination);const t0=actx.currentTime;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.15);os.start(t0);os.stop(t0+.17)}catch(e){}}
function paintTimer(){
  const el=$('#timer');const T=db.active?.timer;
  if(!T||S.tab!=='workout'&&S.tab!=='today'){el.hidden=true;el.dataset.mode='';return}
  el.hidden=false;el.style.bottom=tabsGap()+'px';
  const now=Date.now();const work=T.kind==='work';const prep=work&&now<T.go;
  const rem=prep?(T.go-now)/1000:(T.end-now)/1000;const over=!prep&&rem<=0;
  if(work){const sec=Math.ceil(rem);if(prep&&T.lastTick!==sec){T.lastTick=sec;shortBeep(520)}if(!prep&&!T.started){T.started=true;shortBeep(990);haptic(30)}}
  if(over&&!T.fired){T.fired=true;beep();haptic([200,100,200]);
    if(work){logSet(T.i,{load:T.load,secs:T.total,t:now});return}save()}
  const mode=(prep?'prep':over?'end':'run')+'|'+T.kind+'|'+(T.label||'');
  if(el.dataset.mode!==mode){el.dataset.mode=mode;el.classList.toggle('end',over);el.classList.toggle('work',work&&!prep);
    const title=work?(prep?'Prépare-toi':'Effort · tiens bon'):(over?'Repos terminé':'Repos');
    el.innerHTML=`<div class="in" role="timer" aria-live="off"><span class="t"></span><span class="lab">${title}<b>${over?'Série suivante':esc(T.label||'')}</b></span>
     ${work?`<button data-act="workDone" style="width:auto;padding:0 10px">Terminer</button><button data-act="workCancel" aria-label="Annuler la série">✕</button>`:over?`<button data-act="timerClose" aria-label="Fermer" style="width:auto;padding:0 12px">OK</button>`:`<button data-act="timerAdd" data-d="-15" aria-label="Moins 15 secondes">−15</button><button data-act="timerAdd" data-d="15" aria-label="Plus 15 secondes">+15</button><button data-act="timerClose" aria-label="Passer le repos">Passer</button>`}
     <span class="pb"></span></div>`}
  el.querySelector('.t').textContent=prep?String(Math.ceil(rem)):over?'0:00':mmss(Math.ceil(rem));
  el.querySelector('.pb').style.width=(prep?0:over?100:clamp(1-rem/T.total)*100)+'%';
}
function paintReading(){const el=$('#reader');const R=db.reading;if(!el)return;
  if(!R){if(!el.hidden&&!el.classList.contains('closing')){el.hidden=true;el.dataset.mode=''}return}
  el.hidden=false;const rem=(R.end-Date.now())/1000,over=rem<=0;const C=2*Math.PI*118;
  if(over&&!R.fired){R.fired=true;const D=day(TODAY());D.morning=Object.assign(D.morning||{},{bible:true});save();beep();haptic([200,100,200]);
    setTimeout(()=>{el.classList.add('closing');setTimeout(()=>{db.reading=null;save();el.hidden=true;el.classList.remove('closing');el.dataset.mode='';render()},500)},2400)}
  const mode=over?'done':'run';
  if(el.dataset.mode!==mode){el.dataset.mode=mode;
    el.innerHTML=over?`<div class="rd-in"><svg class="rd-check" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/><path d="M37 62l15 15 32-34"/></svg><div class="rd-done">Validé</div><div class="rd-l">Bonne journée</div></div>`
    :`<div class="rd-in"><div class="rd-ring"><svg viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="118" class="bg"/><circle cx="130" cy="130" r="118" class="fg" stroke-dasharray="${C.toFixed(1)}" transform="rotate(-90 130 130)"/></svg><div class="rd-t num"></div></div>

  if(!over){el.querySelector('.rd-t').textContent=mmss(Math.ceil(rem));el.querySelector('.fg').setAttribute('stroke-dashoffset',(C*clamp(1-rem/R.total)).toFixed(1))}
}

function startWorkout(tid){const t=db.templates.find(x=>x.id===tid);
  const w={id:uid(),date:TODAY(),kind:'muscu',templateId:t?.id||null,name:t?.name||'Séance libre',start:Date.now(),end:null,exercises:(t?.exercises||[]).map(e=>({name:e.name,sets:+e.sets||3,reps:e.reps||'',rest:+e.rest||40,logged:[],tech:''})),feel:null,note:''};
  db.workouts.push(w);db.active={id:w.id,timer:null};S.openEx=null;save();unlockAudio();keepAwake();S.tab='workout';render({top:true});if(!t)addExSheet()}
function logSet(i,s){const w=db.workouts.find(x=>x.id===db.active.id);const e=w.exercises[i];
  e.logged.push(s);haptic();
  if(e.logged.length>=e.sets&&S.openEx===i)S.openEx=null;
  const last=w.exercises.every(x=>x.logged.length>=x.sets);
  if(db.active.timer?.kind==='work')db.active.timer=null;
  if(st().autoTimer&&!last){const bonus=s.rir===0&&st().failureBonus?30:0;const nextEx=e.logged.length>=e.sets?w.exercises.find(x=>x.logged.length<x.sets):e;startTimer(e.rest+bonus,(nextEx?nextEx.name:e.name)+(bonus?' · +30 s (échec)':''))}
  save();render();if(last)hud('Tous les exercices sont faits. Termine la séance.')}

function parseHealth(txt){const map={poids:'weight',weight:'weight',mg:'fat',fat:'fat',muscle:'muscle',visceral:'visceral',visc:'visceral',sommeil:'sleepH',sleep:'sleepH',pas:'steps',steps:'steps',eau:'water'};const out={};
  String(txt||'').split(/[;\n,&](?=\s*[a-zA-Zéè]+\s*[=:])/).forEach(p=>{const m=p.match(/([a-zA-Zéè]+)\s*[=:]\s*([\d.,]+)/);if(m&&map[m[1].toLowerCase()])out[map[m[1].toLowerCase()]]=num(m[2])});return out}
function applyHealth(o){const t=TODAY(),D=day(t);const mk=['weight','fat','muscle','visceral','sleepH'],ek=['steps','water'];let n=0;
  mk.forEach(k=>{if(o[k]!=null){D.morning=D.morning||{};D.morning[k]=o[k];if(!D.morning.time)D.morning.time=nowHM();n++}});
  ek.forEach(k=>{if(o[k]!=null){D.evening=D.evening||{};D.evening[k]=o[k];n++}});save();return n}
async function importHealth(){let txt='';try{txt=await navigator.clipboard.readText()}catch(e){}
  if(!txt){sheet('Coller les données Santé',`<form id="sf" data-form="healthPaste">${sec('',`<div class="cell"><textarea name="t" rows="4" placeholder="poids=81,2; mg=18,4; pas=8450"></textarea></div>`,'Colle le texte copié par ton raccourci.')}</form>`,{save:'Importer'});return}
  const o=parseHealth(txt);const n=applyHealth(o);closeSheet(true);render();hud(n?`${n} valeur${n>1?'s':''} importée${n>1?'s':''}`:'Aucune valeur reconnue dans le presse-papiers')}

document.addEventListener('click',ev=>{

  const food=ev.target.closest('[data-food]');if(food){const ta=$('#foods');ta.value=(ta.value.trim()?ta.value.trim().replace(/,\s*$/,'')+', ':'')+food.dataset.food;return}
  const hs=ev.target.closest('[data-hstep]');if(hs){const k=hs.dataset.hstep,h=$('#hi-'+k);const v=clamp((num(h.value)||0)+ +hs.dataset.d,0,6);h.value=v;$('#h-'+k).textContent=fmt(v);return}
  const is=ev.target.closest('[data-istep]');if(is){const h=$('#'+is.dataset.istep);const v=clamp((+h.value||0)+ +is.dataset.d,0,30);h.value=v;$('#o-'+is.dataset.istep).textContent=v;return}
  const sp=ev.target.closest('[data-step]');if(sp){const inp=$('#'+sp.dataset.step);const v=Math.max(0,(num(inp.value)||0)+ +sp.dataset.d);inp.value=String(Math.round(v*100)/100).replace('.',',');return}
  const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;
  if(act==='closeSheet'){if(el.classList.contains('scrim')&&ev.target!==el)return;if(REC.mr&&REC.mr.state==='recording'){REC.cancel=true;REC.mr.stop()}if(S.brPend?.length&&$('#sf[data-form=brNote]')){const ps=S.brPend.map(m=>m.path);S.brPend=[];if(sb&&A.user)sb.storage.from(BRAIN_BUCKET).remove(ps).catch(()=>{})}closeSheet();return}
  if(el.closest('.asheet'))closeSheet(true);
  if(act==='agMorning'){morningSheet();return}
  if(act==='agEvening'){eveningSheet();return}
  if(act==='agWeekly'){weeklySheet();return}
  if(act==='agWorkout'){S.tab='workout';openArea('forme');return}

   case 'morning':morningSheet();break;
   case 'bibleStart':{unlockAudio();const mn=Math.max(1,+st().reading?.min||10);db.reading={end:Date.now()+mn*60000,total:mn*60,fired:false};save();const go=()=>{closeSheet(true);paintReading()};if(document.querySelector('#bloom'))bloomFrom(el.querySelector('.ico')||el,'#A2845E',go);else go();try{if('wakeLock' in navigator&&!wakeLock)navigator.wakeLock.request('screen').then(w=>{wakeLock=w}).catch(()=>{})}catch(e){}break}
   case 'bibleStop':{const r=$('#reader');r.classList.add('closing');db.reading=null;save();setTimeout(()=>{r.hidden=true;r.classList.remove('closing');r.dataset.mode=''},450);break}
   case 'bibleAdd':if(db.reading){db.reading.end+=60000;db.reading.total+=60;save();paintReading()}break;
   case 'evening':eveningSheet();break;
   case 'weekly':weeklySheet();break;
   case 'newMeal':mealSheet();break;
   case 'editMeal':mealSheet(peekDay(TODAY()).meals.find(m=>m.id===id));break;
   case 'delMeal':{const D=day(TODAY());D.meals=D.meals.filter(m=>m.id!==id);save();closeSheet();render();hud('Repas supprimé');break}
   case 'goWorkout':setTab('workout');break;
   case 'goStats':setTab('stats');break;
   case 'startWorkout':if(db.active){hud('Une séance est déjà en cours');setTab('workout');break}startWorkout(id);break;
   case 'openEx':{const i=+el.dataset.i;const w=db.workouts.find(x=>x.id===db.active.id);const cur=S.openEx??w.exercises.findIndex(e=>e.logged.length<e.sets);S.openEx=cur===i?-1:i;render();break}
   case 'restNow':{const w=db.workouts.find(x=>x.id===db.active.id);const e=w.exercises[+el.dataset.i];startTimer(e.rest,e.name);break}
   case 'timerAdd':{const T=db.active?.timer;if(T){T.end+= +el.dataset.d*1000;T.total=Math.max(T.total+ +el.dataset.d,1);if(T.end<=Date.now())T.end=Date.now();T.fired=false;save();paintTimer()}break}
   case 'workStart':{const i=+el.dataset.i;const f=el.closest('form');const secs=Math.max(5,Math.round(num(f.querySelector('[name=secs]').value)||timedSecs(db.workouts.find(x=>x.id===db.active.id).exercises[i])||30));

/* Bilan des candidatures : chiffres clés et répartitions (barres horizontales, une seule teinte, valeurs écrites) */
function carStats(){const all=jobs();
  if(!all.length)return sec('',`<div class="cell"><span class="body fn">Pas encore de candidature. Ajoute-en ou importe ton fichier Excel depuis l’onglet Candidatures.</span></div>`);
  const by=f=>{const m=new Map();all.forEach(j=>{const k=f(j);if(k)m.set(k,(m.get(k)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1])};
  const bars=(rows,max)=>{const mx=max||Math.max(...rows.map(r=>r[1]),1);return rows.map(([l,n])=>`<div class="cell st-row"><span class="st-l">${esc(l)}</span><span class="st-bar"><i style="width:${Math.max(3,n/mx*100)}%"></i></span><span class="st-v">${n}</span></div>`).join('')};
  const n=all.length,cnt=st=>all.filter(j=>j.status===st).length;
  const pending=cnt('envoyee'),answered=cnt('refus')+cnt('entretien')+cnt('offre'),closed=n-pending;
  const reachedIv=all.filter(j=>(j.interviews||[]).length||j.status==='entretien'||j.status==='offre'||/entretien/i.test(j.stage||'')).length;
  const pct=(a,b)=>b?Math.round(a/b*100)+' %':'–';
  const months=by(j=>j.date&&j.date.slice(0,7)).sort((a,b)=>a[0].localeCompare(b[0])).slice(-8).map(([m,v])=>[new Date(m+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}),v]);
  const top=by(j=>j.company.trim());
  return `<div class="kpis tilesrow"><div><span class="v">${n}</span><span class="k">envoyées</span></div><div><span class="v">${pct(answered,closed)}</span><span class="k">réponses</span></div><div><span class="v">${reachedIv}</span><span class="k">entretiens</span></div><div><span class="v">${cnt('offre')}</span><span class="k">offres</span></div></div>
   ${sec('Par statut',bars(JOBST.map(([k,l])=>[l,cnt(k)]).filter(r=>r[1]),n),`Taux de réponse : refus, entretiens et offres sur les candidatures closes ou avancées (${closed}). ${pending} en attente.`,'notile')}
   ${by(j=>j.stage).length?sec('Étape atteinte',bars(by(j=>j.stage)),'','notile'):''}
   ${by(j=>j.reason).length?sec('Raison',bars(by(j=>j.reason)),'','notile'):''}
   ${sec('Par mois',bars(months),'','notile')}
   ${by(j=>j.contract).length?sec('Par contrat',bars(by(j=>j.contract)),'','notile'):''}
   ${by(j=>j.location).length?sec('Par lieu',bars(by(j=>j.location).slice(0,8)),'','notile'):''}
   ${sec('Par entreprise',bars(top.slice(0,8)),top.length>8?`Et ${top.length-8} autre${top.length>8+1?'s':''}.`:'','notile')}`}
function carEvents(){const t=TODAY();
  const up=events().filter(e=>e.date>=t).sort((x,y)=>evWhen(x).localeCompare(evWhen(y))),past=events().filter(e=>e.date<t).sort((x,y)=>evWhen(y).localeCompare(evWhen(x)));
  const cell=e=>`<button class="cell tap" data-act="evEdit" data-id="${e.id}"><span class="body"><span>${esc(e.title)}</span><span class="fn">${[whenDay(e.date)+(e.time?' à '+esc(e.time):''),(EVKIND.find(k=>k[0]===e.kind)||[])[1],e.place&&esc(e.place),nQ(e)?nQ(e)+' question'+(nQ(e)>1?'s':''):null].filter(Boolean).join(' · ')}</span></span>${e.date===t?'<span class="pill tint">Aujourd’hui</span>':''}${I.chev}</button>`;
  const v=S.evView==='past'?'past':'up';
  return `<div class="ev-seg">${seg('evView',[['up',`À venir${up.length?' · '+up.length:''}`],['past',`Passés${past.length?' · '+past.length:''}`]],v)}</div>
   ${v==='up'?sec('',up.map(cell).join('')+addCell('Nouvel événement','evNew'),'Salons, masterclass, conférences… Rappels 2 jours avant et la veille à 19:00, le matin même à 08:00.')
     :sec('',past.length?past.map(cell).join(''):`<div class="cell"><span class="body fn">Aucun événement passé pour l’instant.</span></div>`,'Retrouve ici tes notes et les questions posées.')}`}
function carContacts(){const t=TODAY();
  const due=contacts().filter(x=>x.next).sort((a,b)=>a.next.localeCompare(b.next));
  const rest=contacts().filter(x=>!x.next).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  const cell=x=>`<button class="cell tap" data-act="ctEdit" data-id="${x.id}"><span class="ct-av" style="--h:${hueOf(x.id)}">${esc(x.name.trim().charAt(0).toUpperCase()||'?')}</span><span class="body"><span>${esc(x.name)}</span><span class="fn">${[x.role&&esc(x.role),x.company&&esc(x.company)].filter(Boolean).join(' · ')||esc(x.met||'')}</span></span>${x.next?`<span class="pill ${x.next<=t?'late':''}">${x.next<t?'En retard':x.next===t?'Aujourd’hui':fdate(x.next)}</span>`:''}${I.chev}</button>`;
  return `${due.length?sec('À contacter',due.map(cell).join('')):''}
   ${sec(due.length?'Autres contacts':'',rest.map(cell).join('')+addCell('Nouveau contact','ctNew'),'Recruteurs, personnes rencontrées, anciens collègues… Donne une date « À recontacter » pour qu’ils apparaissent en haut.')}`}
const ctAction=(href,label)=>`<a class="cell tap link" href="${esc(href)}" ${/^https/.test(href)?'target="_blank" rel="noopener"':''}>${label}</a>`;

  sheet(isNew?'Nouveau contact':'Contact',`<form id="sf" data-form="ct" data-id="${x.id||''}">
   ${acts.length?sec('',acts.join('')):''}
   ${sec('',`<label class="cell field" for="cn"><span>Nom</span><input id="cn" name="name" value="${esc(x.name)}" required placeholder="Prénom Nom" autocomplete="off"></label>
     <label class="cell field" for="cco"><span>Entreprise</span><input id="cco" name="company" value="${esc(x.company)}" placeholder="Facultatif" autocomplete="off"></label>

     <label class="cell field" for="cli"><span>LinkedIn</span><input id="cli" name="linkedin" inputmode="url" autocapitalize="off" value="${esc(x.linkedin)}" placeholder="Lien du profil" autocomplete="off"></label>
     <label class="cell field" for="cph"><span>Téléphone</span><input id="cph" name="phone" type="tel" value="${esc(x.phone)}" placeholder="06…" autocomplete="off"></label>`)}
   ${sec('Suivi',`<label class="cell field" for="cmet"><span>Rencontré</span><input id="cmet" name="met" value="${esc(x.met)}" placeholder="Salon, via un ami…" autocomplete="off"></label>
     <label class="cell field" for="cnx"><span>À recontacter le</span><input id="cnx" name="next" type="date" value="${x.next||''}"></label>
     ${isNew?'':`<div class="cell"><span class="body" id="clast">${x.last?'Dernier contact le '+fdate(x.last):'Pas encore de contact noté'}</span></div><button type="button" class="cell tap link" data-act="ctDone" data-id="${x.id}">Contact fait aujourd’hui</button>`}`,isNew?'':'« Contact fait » note la date et retire le contact de « À contacter ».')}
   ${sec('Notes',`<div class="cell"><textarea name="notes" rows="4" placeholder="De quoi vous avez parlé, ce que tu veux lui demander…">${esc(x.notes||'')}</textarea></div>`)}
   ${isNew?'':sec('',`<button type="button" class="cell tap danger center" data-act="ctAskDel" data-id="${x.id}">Supprimer le contact</button>`)}
  </form>`)}
function ctSubmit(f,v){let x=contacts().find(c=>c.id===f.dataset.id);const isNew=!x;if(isNew){x={id:uid()};contacts().push(x)}
  Object.assign(x,{name:v.name.trim(),company:(v.company||'').trim(),role:(v.role||'').trim(),email:(v.email||'').trim(),linkedin:(v.linkedin||'').trim(),phone:(v.phone||'').trim(),met:(v.met||'').trim(),next:v.next||'',notes:(v.notes||'').trim()});

function ivRow(i={date:'',time:'',kind:'visio',note:''}){return `<div class="cell block" data-ivrow><div class="mini three"><label>Date<input type="date" name="ivd" value="${i.date}"></label><label>Heure<input type="time" name="ivt" value="${i.time||''}"></label><label>Type<select name="ivk" style="font:16px var(--font);color:var(--label);background:var(--card);border:0;border-radius:8px;padding:7px 9px">${IVKIND.map(([k,l])=>`<option value="${k}" ${k===i.kind?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="mini" style="grid-template-columns:1fr auto"><label>Note<input name="ivn" value="${esc(i.note||'')}" placeholder="Avec qui, points à préparer…"></label><button type="button" class="danger" data-act="rmIv" aria-label="Retirer" style="align-self:end;padding:8px">✕</button></div></div>`}
const relTxt=j=>{const r=j.relances||[];return r.length?`${r.length} relance${r.length>1?'s':''} · dernière le ${fdate(r[r.length-1])}`:'Aucune relance'};
function jobSheet(j,o={}){const isNew=!j;j=j||{company:'',role:'',link:'',date:TODAY(),status:'envoyee',note:'',relances:[],interviews:[]};
  const ivs=(j.interviews||[]).slice();if(o.addIv)ivs.push({date:'',time:'',kind:'visio',note:''});
  sheet(isNew?'Nouvelle candidature':'Candidature',`<form id="sf" data-form="job" data-id="${j.id||''}">
   ${sec('',`<label class="cell field" for="jc"><span>Entreprise</span><input id="jc" name="company" value="${esc(j.company)}" required placeholder="Nom" autocomplete="off"></label>
     <label class="cell field" for="jr"><span>Poste</span><input id="jr" name="role" value="${esc(j.role)}" placeholder="Intitulé" autocomplete="off"></label>
     <label class="cell field" for="jct"><span>Contrat</span><select id="jct" name="contract"><option value="">—</option>${CONTRACTS.map(c=>`<option ${c===j.contract?'selected':''}>${c}</option>`).join('')}</select></label>
     <label class="cell field" for="jlo"><span>Lieu</span><input id="jlo" name="location" value="${esc(j.location||'')}" placeholder="Ville ou pays" autocomplete="off"></label>
     <label class="cell field" for="jl"><span>Annonce</span><input id="jl" name="link" inputmode="url" autocapitalize="off" value="${esc(j.link)}" placeholder="Lien (facultatif)" autocomplete="off"></label>
     <label class="cell field" for="jd"><span>Envoyée le</span><input id="jd" name="date" type="date" value="${j.date}" required></label>
     <label class="cell field" for="js"><span>Statut</span><select id="js" name="status">${JOBST.map(([k,l])=>`<option value="${k}" ${k===j.status?'selected':''}>${l}</option>`).join('')}</select></label>
     <label class="cell field" for="jcn"><span>Contact</span><input id="jcn" name="contact" value="${esc(j.contact||'')}" placeholder="Facultatif" autocomplete="off"></label>`)}
   ${sec('Entretiens',`<div id="ivrows">${ivs.map(ivRow).join('')}</div>`+addCell('Ajouter un entretien','addIv'))}
   ${isNew?'':sec('Relances',`<div class="cell"><span class="body" id="jrel">${relTxt(j)}</span></div><button type="button" class="cell tap link" data-act="jobRelance" data-id="${j.id}">Noter une relance aujourd’hui</button>`,`Sans nouvelles, la candidature passe dans « À faire » ${car().relance} jours après le dernier contact.`)}
   ${sec('Résultat',`<label class="cell field" for="jst"><span>Étape atteinte</span><input id="jst" name="stage" value="${esc(j.stage||'')}" placeholder="Screening, entretien RH…" autocomplete="off"></label>
     <label class="cell field" for="jrs"><span>Raison</span><input id="jrs" name="reason" value="${esc(j.reason||'')}" placeholder="Autre candidat, test…" autocomplete="off"></label>`)}
   ${sec('',`<div class="cell"><textarea name="note" rows="2" placeholder="Note : salaire, ressenti…">${esc(j.note||'')}</textarea></div>`)}
   ${j.link?sec('',`<a class="cell tap link" href="${esc(safeUrl(j.link))}" target="_blank" rel="noopener">Ouvrir l’annonce</a>`):''}
   ${isNew?'':sec('',`<button type="button" class="cell tap danger center" data-act="askDelJob" data-id="${j.id}">Supprimer la candidature</button>`)}
  </form>`)}
function jobGoalSheet(){const c=car();sheet('Objectif',`<form id="sf" data-form="jobGoal">
   ${sec('',`<div class="cell"><span class="body"><span>Candidatures par semaine</span><span class="fn">Ciblées, du lundi au dimanche</span></span><div class="stepper"><button type="button" data-istep="cg" data-d="-1" aria-label="Moins">−</button><output id="o-cg">${c.goal}</output><button type="button" data-istep="cg" data-d="1" aria-label="Plus">+</button></div><input type="hidden" id="cg" name="goal" value="${c.goal}"></div>
     <label class="cell field" for="crl"><span>Relancer après</span><select id="crl" name="relance">${[5,7,10,14].map(n=>`<option value="${n}" ${n===c.relance?'selected':''}>${n} jours</option>`).join('')}</select></label>`,'Une candidature sans nouvelles passe dans « À faire » après ce délai.')}

   ${sec('Questions à poser',`<div class="cell"><textarea name="questions" rows="4" placeholder="Une question par ligne">${esc(e.questions||'')}</textarea></div>`)}
