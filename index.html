function evSubmit(f,v){let e=events().find(x=>x.id===f.dataset.id);const isNew=!e;if(isNew){e={id:uid()};events().push(e)}
  Object.assign(e,{title:v.title.trim(),kind:v.kind,date:v.date,time:v.time||'',place:(v.place||'').trim(),link:(v.link||'').trim(),questions:(v.questions||'').trim(),notes:(v.notes||'').trim()});
  save();closeSheet();paintCareer();haptic();hud(isNew?'Événement ajouté':'Événement enregistré')}
function jobAct(act,id,el){const j=jobs().find(x=>x.id===id);
  switch(act){
   case 'jobNew':jobSheet();break;
   case 'jobEdit':if(j)jobSheet(j);break;
   case 'jobGoal':jobGoalSheet();break;
   case 'jobOld':S.carOld=!S.carOld;paintCareer();break;
   case 'carTab':if(S.car===el.dataset.v){const a=$('#area');if(a.scrollTop>8)a.scrollTo({top:0,behavior:reduce()?'auto':'smooth'});else if(S.car===CTABS[0][0])showHome(true);break}S.car=el.dataset.v;try{localStorage.setItem(K+':car',S.car)}catch(e){}haptic(6);paintCareer({top:true});break;
   case 'ctNew':ctSheet();break;
   case 'ctEdit':{const x=contacts().find(c=>c.id===id);if(x)ctSheet(x);break}
   case 'ctDone':{const x=contacts().find(c=>c.id===id);x.last=TODAY();x.next='';const n=$('#cnx');if(n)n.value='';save();haptic();hud('Contact noté');const l=$('#clast');if(l)l.textContent='Dernier contact le '+fdate(x.last);paintCareer();break}
   case 'ctAskDel':asheet('Supprimer ce contact et ses notes ?',[{label:'Supprimer le contact',act:'ctDel',data:{id},danger:true}]);break;
   case 'ctDel':db.contacts=contacts().filter(c=>c.id!==id);save();paintCareer();hud('Contact supprimé');break;
   case 'evNew':evSheet();break;
   case 'evEdit':{const e=events().find(x=>x.id===id);if(e)evSheet(e);break}
   case 'evOld':S.evOld=!S.evOld;paintCareer();break;
   case 'evAskDel':asheet('Supprimer cet événement et ses notes ?',[{label:'Supprimer l’événement',act:'evDel',data:{id},danger:true}]);break;
   case 'evDel':db.events=events().filter(x=>x.id!==id);save();paintCareer();hud('Événement supprimé');break;
   case 'addIv':$('#ivrows').insertAdjacentHTML('beforeend',ivRow());break;
   case 'rmIv':el.closest('[data-ivrow]').remove();break;
   case 'jobMenu':asheet(`${j.company} · envoyée le ${fdate(j.date)}`,[{label:'Relance faite aujourd’hui',act:'jobRelance',data:{id}},{label:'Réponse : entretien',act:'jobIv',data:{id}},{label:'Classer sans réponse',act:'jobSilence',data:{id}},{label:'Réponse : refus',act:'jobRefus',data:{id},danger:true}]);break;
   case 'jobRelance':{const r=j.relances||(j.relances=[]);if(r[r.length-1]===TODAY()){hud('Relance déjà notée aujourd’hui');break}r.push(TODAY());save();haptic();hud('Relance notée');const x=$('#jrel');if(x)x.textContent=relTxt(j);paintCareer();break}
   case 'jobIv':jobSheet(j,{addIv:true});break;
   case 'jobSilence':j.status='silence';save();paintCareer();hud('Classée sans réponse');break;
   case 'jobRefus':j.status='refus';save();paintCareer();hud('Refus noté. La suivante !');break;
   case 'askDelJob':asheet('Supprimer cette candidature ?',[{label:'Supprimer la candidature',act:'delJob',data:{id},danger:true}]);break;
   case 'delJob':db.jobs=jobs().filter(x=>x.id!==id);save();paintCareer();hud('Candidature supprimée');break;
   default:return false}
  return true}
function jobSubmit(f,v){
  if(f.dataset.form==='jobGoal'){car().goal=Math.max(1,+v.goal||5);car().relance=+v.relance||7;save();closeSheet();paintCareer();hud('Objectif enregistré');return}
  let j=jobs().find(x=>x.id===f.dataset.id);const isNew=!j;const before=weekApps();
  if(isNew){j={id:uid(),relances:[]};jobs().push(j)}
  const ivs=[...f.querySelectorAll('[data-ivrow]')].map(r=>({date:r.querySelector('[name=ivd]').value,time:r.querySelector('[name=ivt]').value,kind:r.querySelector('[name=ivk]').value,note:r.querySelector('[name=ivn]').value.trim()})).filter(i=>i.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  Object.assign(j,{company:v.company.trim(),role:(v.role||'').trim(),contract:v.contract||'',location:(v.location||'').trim(),contact:(v.contact||'').trim(),stage:(v.stage||'').trim(),reason:(v.reason||'').trim(),link:(v.link||'').trim(),date:v.date||TODAY(),status:v.status==='envoyee'&&ivs.length?'entretien':v.status,note:(v.note||'').trim(),interviews:ivs});
  save();closeSheet();paintCareer();haptic();
  hud(isNew&&before<car().goal&&weekApps()>=car().goal?'Objectif de la semaine atteint !':isNew?'Candidature ajoutée':'Candidature enregistrée')}
/* ================= section Tâches : to-do avec échéances et priorités ================= */
const PRIO=[['haute','Haute'],['moyenne','Moyenne'],['basse','Basse']];
const REPEAT=[['','Jamais'],['day','Chaque jour'],['weekday','En semaine (lun.–ven.)'],['week','Chaque semaine'],['month','Chaque mois'],['year','Chaque année']];
const REP_SHORT={day:'chaque jour',weekday:'en semaine',week:'chaque semaine',month:'chaque mois',year:'chaque année'};
/* tâche récurrente : prochaine échéance après aujourd'hui (les occurrences manquées sont sautées) */
function stepDue(d,r,dom){if(r==='day')return addDays(d,1);if(r==='week')return addDays(d,7);
  if(r==='weekday'){let n=addDays(d,1);while(dow(n)>4)n=addDays(n,1);return n}
  const [y,m]=d.split('-').map(Number),k=(m-1)+(r==='year'?12:1),ny=y+Math.floor(k/12),nm=k%12+1,last=new Date(ny,nm,0).getDate();
  return `${ny}-${String(nm).padStart(2,'0')}-${String(Math.min(dom||+d.slice(8),last)).padStart(2,'0')}`}
function nextDue(x){let n=stepDue(x.due||TODAY(),x.rep,x.dom);while(n<=TODAY())n=stepDue(n,x.rep,x.dom);return n}
const TD_CATS=['Perso','Travail','Carrière','Admin','Maison','Santé','Finances','Courses'];
const PRIO_C={haute:'var(--red)',moyenne:'var(--orange)',basse:'var(--label3)'};
const todos=()=>db.todos||(db.todos=[]);
const prioRank=p=>({haute:0,moyenne:1,basse:2}[p]??1);
const TBUCKETS=[['late','En retard'],['today','Aujourd’hui'],['tomorrow','Demain'],['week','Dans les 7 jours'],['later','Plus tard'],['none','Sans échéance']];
const todoBucket=(x,t)=>{if(!x.due)return 'none';const n=diff(t,x.due);return n<0?'late':n===0?'today':n===1?'tomorrow':n<=7?'week':'later'};
function paintTodos(){const v=$('#area'),t=TODAY();
  const open=todos().filter(x=>!x.done).sort((a,b)=>prioRank(a.prio)-prioRank(b.prio)||(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'99').localeCompare(b.time||'99'));
  const done=todos().filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const cnt=k=>open.filter(x=>todoBucket(x,t)===k).length,week=Date.now()-7*864e5;

const brUrls=new Map();
async function brUrl(path){const c=brUrls.get(path);if(c&&c.exp>Date.now())return c.url;
  const r=await sb.storage.from(BRAIN_BUCKET).createSignedUrl(path,3600);if(r.error)throw r.error;brUrls.set(path,{url:r.data.signedUrl,exp:Date.now()+3500e3});return r.data.signedUrl}
function brText(n){const media=id=>(n.media||[]).find(m=>m.id===id);
  const mEl=m=>`<div class="br-m br-inl" data-path="${esc(m.path)}" data-type="${m.type}">${m.type==='image'?'<div class="br-img"></div>':m.type==='audio'?'<audio controls preload="none"></audio>':'<video controls playsinline preload="metadata"></video>'}${m.type==='image'?'':`<div class="br-mf"><span class="fn">${esc(BR_ICON[m.type])}${m.name?' · '+esc(m.name):''}</span></div>`}</div>`;
  const dec=t=>t.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');
  const lines=esc(n.body||'').split('\n');
  return lines.map(l=>{
    const only=l.match(/^\s*!\[\[media:([a-z0-9]+)\]\]\s*$/);if(only){const m=media(only[1]);return m?mEl(m):''}
    let h=l.replace(/!\[\[media:([a-z0-9]+)\]\]/g,(x,id)=>{const m=media(id);return m?mEl(m):''})
     .replace(/(?<!!)\[\[([^\]\n]{1,120})\]\]/g,(m,t)=>{const x=brByTitle(dec(t));return `<button type="button" class="br-ln${x?'':' new'}" data-act="brGoTitle" data-t="${t}">${t}</button>`})
     .replace(/\[([^\]\n]{1,120})\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
     .replace(/(?<![">=])(https?:\/\/[^\s<"]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'').slice(0,40)}${u.length>48?'…':''}</a>`)
     .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    if(/^#{1,3}\s+/.test(l))return `<h3>${h.replace(/^#{1,3}\s+/,'')}</h3>`;
    return /^\s*[-•]\s+/.test(l)?`<li>${h.replace(/^\s*[-•]\s+/,'')}</li>`:h?`<p>${h}</p>`:''}).join('').replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`)}

/* photos réduites (2048 px max, JPEG) avant l'envoi */
async function brShrink(file){if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;
  try{const url=URL.createObjectURL(file);const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const k=Math.min(1,2048/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));return b&&b.size<file.size?b:file}catch(e){return file}}
async function brUpload(n,blob,type,name,pending){if(!sb||!A.user){hud('Connecte-toi pour ajouter des médias');return false}if(needNet())return false;
  if(blob.size>BR_MAX){hud('Fichier trop lourd (50 Mo max) : ajoute plutôt un lien');return false}
  const id=uid(),ext=((blob.type||'').split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5)||'bin',path=`${A.user.id}/${n.id}/${id}.${ext}`;
  const r=await sb.storage.from(BRAIN_BUCKET).upload(path,blob,{contentType:blob.type||'application/octet-stream',upsert:false});
  if(r.error){hud(/bucket|not found/i.test(r.error.message)?'Espace médias pas encore créé dans Supabase':'Envoi impossible : '+r.error.message);return false}

   ${sec('Entraînement',`<div class="cell block"><span>Jours de séance</span><div class="toggles">${DAYS.map((d,k)=>`<label><input type="checkbox" name="ob_days" value="${k}" ${s.trainingDays.includes(k)?'checked':''}><span>${d}</span></label>`).join('')}</div></div>`)}
   ${sec('Rituel du matin',`<label class="cell" for="ob_ron"><span class="body"><span>Lecture chronométrée</span><span class="fn">Bible, livre, méditation…</span></span><input id="ob_ron" name="ob_ron" type="checkbox" class="switch" ${r.on?'checked':''}></label>
     <label class="cell field" for="ob_rl"><span>Intitulé</span><input id="ob_rl" name="ob_rl" value="${esc(r.label)}"></label>${fieldNum('ob_rm','Durée',r.min,'min','10')}`)}
   ${sec('Alimentation',`<label class="cell" for="ob_sup"><span class="body"><span>Suivre mes compléments</span><span class="fn">Vitamines, zinc, magnésium, créatine</span></span><input id="ob_sup" name="ob_sup" type="checkbox" class="switch" ${s.supps?'checked':''}></label>
     <label class="cell field" for="ob_diet"><span>Contraintes</span><input id="ob_diet" name="ob_diet" value="${esc(s.diet||'')}" placeholder="Aucune"></label>`)}
   <p class="g-msg" role="alert"></p>
   <button class="btn-fill g-go">Commencer</button>
  </form></div>`;g.scrollTop=0}
function doOnboard(f){const fd=new FormData(f),v=Object.fromEntries(fd);const s=st();
  const name=String(v.ob_name||'').trim();if(!name){f.querySelector('.g-msg').textContent='Indique ton prénom.';$('#ob_name').focus();return}
  s.name=name;s.height=num(v.ob_height);s.startWeight=num(v.ob_start);s.targetWeight=num(v.ob_target);
  s.trainingDays=fd.getAll('ob_days').map(Number).sort();s.reading={on:!!v.ob_ron,label:String(v.ob_rl||'').trim()||'Lecture',min:Math.max(1,Math.round(num(v.ob_rm)||10))};
  s.supps=!!v.ob_sup;s.diet=String(v.ob_diet||'').trim();s.onboarded=1;save();hideGate();refreshAll();hud('C’est parti, '+name)}

/* ---------- groupe d’amis ---------- */
async function loadGroup(force){
  if(!sb||!A.user)return;if(!force&&Date.now()-A.lastFetch<30000)return;A.lastFetch=Date.now();
  try{
    const m=await sb.from('group_members').select('group_id').eq('user_id',A.user.id);if(m.error)throw m.error;
    if(!m.data.length){A.group=null;A.members=[];A.shares=[]}
    else{
      const g=await sb.from('groups').select('id,code,name,owner').in('id',m.data.map(x=>x.group_id));if(g.error)throw g.error;
      A.group=(g.data||[])[0]||null;
      if(A.group){
        const mem=await sb.from('group_members').select('user_id').eq('group_id',A.group.id);if(mem.error)throw mem.error;
        const ids=mem.data.map(x=>x.user_id);
        const [p,sh]=await Promise.all([sb.from('profiles').select('id,name').in('id',ids),
          sb.from('daily_share').select('user_id,day,morning,evening,session,progress').in('user_id',ids).gte('day',addDays(TODAY(),-6))]);
        A.members=ids.map(id=>({id,name:(p.data||[]).find(x=>x.id===id)?.name||'Ami'}));A.shares=sh.data||[];
        const ch=await sb.from('cheers').select('from_id,to_id,day').gte('day',addDays(TODAY(),-6));A.cheers=ch.data||[];
      }}
  }catch(e){}
  paintFriends();
  if(((S.tab==='settings'&&$('#home').hidden&&$('#area').hidden)||prefsOn())&&!$('#layer').innerHTML&&!document.activeElement?.matches?.('input,textarea'))refreshView()}
function memberStats(id){
  const days=Array.from({length:7},(_,k)=>addDays(TODAY(),k-6));
  const rows=id===A.user.id?days.map(d=>shareRow(d)):days.map(d=>A.shares.find(x=>x.user_id===id&&x.day===d)||{day:d});
  const prog=id===A.user.id?progressPct(TODAY()):([...A.shares].filter(x=>x.user_id===id&&x.progress!=null).sort((a,b)=>b.day.localeCompare(a.day))[0]?.progress??null);
  return {rows,prog,reg:rows.filter(r=>r.morning&&r.evening).length,sess:rows.filter(r=>r.session).length}}
const hueOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
function paintFriends(){const el=$('#friends');if(!el)return;
  if(!A.user){el.innerHTML='';return}
  if(!A.group){el.innerHTML=`<button type="button" class="fr-card fr-empty" data-act="groupMenu"><span class="fr-plus">${I.plus}</span><span><b>Invite tes amis</b><small>Crée un groupe ou rejoins-en un avec un code</small></span></button>`;return}
  const list=[...A.members].sort((a,b)=>(b.id===A.user.id)-(a.id===A.user.id));
  el.innerHTML=`<div class="fr-card"><div class="fr-h"><span>${esc(A.group.name)}</span><button type="button" class="fr-code" data-act="groupMenu" aria-label="Options du groupe">${esc(A.group.code)}</button></div>
   ${list.map(m=>{const me=m.id===A.user.id;const nm=me?(st().name||'Moi'):m.name;const x=memberStats(m.id);
     return `<div class="fr-row"><span class="fr-av" style="--h:${hueOf(m.id)}">${esc(nm.trim().charAt(0).toUpperCase()||'?')}</span>
      <span class="fr-n">${esc(nm)}</span>
      <span class="fr-dots" aria-label="${x.reg} jours complets sur 7, ${x.sess} séances">${x.rows.map(r=>`<i class="d${(r.morning?1:0)+(r.evening?1:0)}${r.session?' s':''}"></i>`).join('')}</span>
      <span class="fr-p" style="--p:${x.prog??0}%">${x.prog!=null?x.prog+' %':'–'}</span>
      ${me?(()=>{const n=A.cheers.filter(c=>c.to_id===A.user.id).length;return `<span class="fr-got" aria-label="${n} encouragements reçus cette semaine">${n?'🔥'+n:''}</span>`})()
        :(()=>{const done=A.cheers.some(c=>c.from_id===A.user.id&&c.to_id===m.id&&c.day===TODAY());return `<button type="button" class="fr-cheer${done?' done':''}" data-act="cheer" data-id="${m.id}" aria-label="Encourager ${esc(nm)}">🔥</button>`})()}</div>`}).join('')}
   <div class="fr-legend"><span><i class="d2"></i>réveil + soir</span><span><i class="d0 s"></i>séance</span><span>% vers l’objectif</span></div></div>`}
function accountSec(){return accountSec0()+notifSec()}
function accountSec0(){
  if(!A.user)return sec('Compte et amis',`<button type="button" class="cell tap link" data-act="gateOpen">Se connecter ou créer un compte</button>`,'Un compte sauvegarde tes données en ligne et te permet de rejoindre tes amis.');
  const g=A.group;
  return sec('Compte',`<div class="cell"><span class="body"><span>${esc(A.user.email||'')}</span><span class="fn">Données sauvegardées en ligne</span></span>${state(true)}</div>
    <button type="button" class="cell tap link" data-act="logout">Se déconnecter</button>`)+
   sec('Groupe d’amis',g?`<div class="cell"><span class="body"><span>${esc(g.name)}</span><span class="fn">${A.members.length} membre${A.members.length>1?'s':''}</span></span><span class="acc num" style="letter-spacing:.1em;font-weight:700">${esc(g.code)}</span></div>
     <button type="button" class="cell tap link" data-act="groupShare">Inviter un ami</button><button type="button" class="cell tap danger" data-act="groupLeave">Quitter le groupe</button>`
     :`<button type="button" class="cell tap link" data-act="groupCreate">Créer un groupe</button><button type="button" class="cell tap link" data-act="groupJoin">Rejoindre avec un code</button>`,
    'Tes amis voient seulement si tu as fait ton réveil, ton soir et ta séance, et ta progression en % vers ton objectif. Jamais ton poids, tes repas ni tes mesures.')}
const deleteSec=()=>A.user?sec('',`<button type="button" class="cell tap danger" data-act="askDeleteMe">Supprimer mon compte</button>`,'Efface ton compte et tes données en ligne. La copie de ce téléphone est conservée.'):'';
/* ---------- notifications (rappels et encouragements) ---------- */
const VAPID_PUB='BHiCNrpHAqdUC4dkmVxKgetHHfH0k7cMmhv-8YMIATT6aQ55pihzGzeR_GuW-9EVtlSKU2FCn_hHb5CG_4UkEuE';
const NOTIF_DEF={on:false,morning:'07:00',evening:'21:30',weekly:'19:00',iv:true,td:true};
const notif=()=>Object.assign({},NOTIF_DEF,st().notif||{});
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol==='https:';
const userTz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Paris'}catch(e){return 'Europe/Paris'}};
const b64u=x=>{const b=atob((x+'='.repeat((4-x.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function notifSave(sub){const j=sub.toJSON();
  const r=await sb.from('push_subs').upsert({endpoint:j.endpoint,user_id:A.user.id,p256dh:j.keys.p256dh,auth:j.keys.auth,tz:userTz(),prefs:notif()});if(r.error)throw r.error}
async function notifEnable(permP){
  const perm=await permP;if(perm!=='granted'){hud('Autorise les notifications : Réglages iPhone › Notifications › Luck’In');return false}
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
  st().notif={...notif(),on:true};save();await notifSave(sub);return true}
async function notifDisable(){try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
  if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}
  st().notif={...notif(),on:false};save()}
/* au lancement : l'adresse d'abonnement peut changer, on la remet à jour sans rien demander */
async function notifRefresh(){try{if(!A.user||!pushOK()||!notif().on||Notification.permission!=='granted')return;
  const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await notifSave(sub)}catch(e){}}
function notifSec(){
  if(!A.user)return '';
  const n=notif();
  if(!pushOK()||(isIOS()&&!standalone()))return sec('Notifications',`<div class="cell"><span class="body fn">Ouvre Luck’In depuis son icône sur l’écran d’accueil pour activer les rappels et les encouragements (iPhone avec iOS 16.4 ou plus).</span></div>`);
  const on=n.on&&Notification.permission==='granted';
  const tm=(k,l)=>`<label class="cell field" for="nt-${k}"><span>${l}</span><input id="nt-${k}" type="time" data-notif="${k}" value="${esc(n[k]||'')}"></label>`;
  return sec('Notifications',`<label class="cell" for="nt-on"><span class="body"><span>Rappels et encouragements</span><span class="fn">${on?'Activés sur ce téléphone':'Désactivés'}</span></span><input id="nt-on" type="checkbox" class="switch" data-notif="on" ${on?'checked':''}></label>
    ${on?tm('morning','Réveil')+tm('evening','Soir')+tm('weekly','Bilan du dimanche')+`<label class="cell" for="nt-iv"><span class="body"><span>Rappels d’entretien et d’événement</span><span class="fn">2 jours avant et la veille à 19:00, le matin même à 08:00</span></span><input id="nt-iv" type="checkbox" class="switch" data-notif="iv" ${n.iv!==false?'checked':''}></label><label class="cell" for="nt-td"><span class="body"><span>Rappels de tâches</span><span class="fn">Résumé à 08:00, et 15 min avant une tâche qui a une heure</span></span><input id="nt-td" type="checkbox" class="switch" data-notif="td" ${n.td!==false?'checked':''}></label>`:''}`,
    'Un rappel n’arrive que si le rituel n’est pas encore fait. Les encouragements de tes amis arrivent aussi en notification.')}
document.addEventListener('change',ev=>{const t=ev.target;const k=t.dataset?.notif;if(!k)return;
  if(k==='on'){
    if(t.checked){const permP=Notification.requestPermission(); /* demandé tout de suite : iOS l'exige pendant le geste */
      t.disabled=true;notifEnable(permP).then(ok=>{if(ok)hud('Notifications activées')}).catch(e=>hud('Erreur : '+(e?.message||e))).finally(()=>{refreshView()})}
    else{t.disabled=true;notifDisable().finally(()=>{refreshView();hud('Notifications désactivées')})}
    return}
  if(k==='iv'||k==='td'){st().notif={...notif(),[k]:t.checked};save();if(A.user)sb.from('push_subs').update({prefs:notif()}).eq('user_id',A.user.id).then(()=>hud(t.checked?'Rappels activés':'Rappels coupés'));return}
  const v=t.value;if(!/^\d{2}:\d{2}$/.test(v))return;st().notif={...notif(),[k]:v};save();
  if(A.user)sb.from('push_subs').update({prefs:notif(),tz:userTz()}).eq('user_id',A.user.id).then(()=>hud('Heure enregistrée'))});
async function fnCall(body){const r=await sb.functions.invoke('push',{body});
  if(r.error){let msg=r.error.message;try{const j=await r.error.context.json();msg=j.error||msg;if(j.already)return {already:true}}catch(e){}throw new Error(msg)}return r.data||{}}
const newCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(6);crypto.getRandomValues(r);return Array.from(r,x=>a[x%32]).join('')};
async function groupCreate(name){
  for(let i=0;i<3;i++){const g=await sb.from('groups').insert({code:newCode(),name:name||'Mon groupe',owner:A.user.id}).select('id,code,name,owner').single();
    if(g.error){if(/duplicate|unique/i.test(g.error.message))continue;throw g.error}
    const m=await sb.from('group_members').insert({group_id:g.data.id,user_id:A.user.id});if(m.error)throw m.error;return g.data}
  throw new Error('Réessaie')}
async function shareCode(){const g=A.group;if(!g)return;const text=`Rejoins mon groupe « ${g.name} » sur Luck’In. Installe l’app : ${APP_URL} puis Réglages › Rejoindre avec un code : ${g.code}`;
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e?.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);hud('Invitation copiée')}catch(e){hud('Code : '+g.code)}}
const needNet=()=>{if(!navigator.onLine){hud('Pas de connexion');return true}return false};

document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  switch(act){
   case 'gateMode':showGate(el.dataset.m);break;
   case 'cheer':{if(needNet())break;const id=el.dataset.id;const nm=A.members.find(m=>m.id===id)?.name||'ton ami';if(el.classList.contains('done')){hud('Déjà encouragé aujourd’hui');break}
     el.classList.add('done');haptic(10);
     try{const r=await fnCall({kind:'cheer',to:id});if(r.already){hud('Déjà encouragé aujourd’hui');break}
       A.cheers.push({from_id:A.user.id,to_id:id,day:TODAY()});hud(r.sent?'🔥 Encouragement envoyé à '+nm:nm+' verra ton encouragement dans l’app')}
     catch(e){el.classList.remove('done');hud('Erreur : '+e.message)}break}
   case 'gateSkip':try{localStorage.setItem(AK,'local')}catch(e){}hideGate();if(!st().onboarded)showOnboard();break;
   case 'gateOpen':showGate('login');break;
   case 'groupMenu':if(!A.group)asheet('Groupe d’amis',[{label:'Créer un groupe',act:'groupCreate'},{label:'Rejoindre avec un code',act:'groupJoin'}]);
     else asheet(`${A.group.name} · code ${A.group.code}`,[{label:'Inviter un ami',act:'groupShare'},{label:'Quitter le groupe',act:'groupLeave',danger:true}]);break;
   case 'groupCreate':sheet('Nouveau groupe',`<form id="sf" data-form="gcreate">${sec('',`<label class="cell field" for="gn"><span>Nom</span><input id="gn" name="name" maxlength="40" placeholder="Les motivés"></label>`,'Un code d’invitation est créé : partage-le à tes amis.')}</form>`,{save:'Créer'});break;
   case 'groupJoin':sheet('Rejoindre un groupe',`<form id="sf" data-form="gjoin">${sec('',`<label class="cell field" for="gc"><span>Code</span><input id="gc" name="code" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.15em"></label>`,'Le code à 6 caractères envoyé par ton ami.')}</form>`,{save:'Rejoindre'});break;
   case 'groupShare':shareCode();break;
   case 'groupLeave':asheet('Quitter le groupe ? Tu pourras le rejoindre avec son code.',[{label:'Quitter le groupe',act:'groupLeaveGo',danger:true}]);break;
   case 'groupLeaveGo':{if(needNet())break;const g=A.group;if(!g)break;
     const r=await sb.from('group_members').delete().eq('group_id',g.id).eq('user_id',A.user.id);
     if(r.error){hud('Erreur : '+r.error.message);break}
     if(g.owner===A.user.id&&A.members.length<=1)await sb.from('groups').delete().eq('id',g.id);
     A.group=null;A.members=[];A.shares=[];paintFriends();refreshView();hud('Groupe quitté');break}
   case 'logout':asheet('Se déconnecter ? Les données quittent ce téléphone mais restent dans ton compte.',[{label:'Se déconnecter',act:'logoutGo',danger:true}]);break;
   case 'logoutGo':{if(A.dirty||A.flushing){const ok=await cloudFlush();if(!ok){hud('Hors ligne : connecte-toi au réseau d’abord');break}}
     try{await sb.auth.signOut()}catch(e){}
     A.user=null;A.group=null;A.members=[];A.shares=[];A.dirty=false;clearTimeout(A.t);
     db=seed();writeLocal();try{localStorage.removeItem(CK)}catch(e){}chat=[];S.tab='today';
     showHome(false);render();showGate('login','Déconnecté.');break}
   case 'askDeleteMe':asheet('Supprimer ton compte ? Tes données en ligne et ta place dans le groupe sont effacées. Action définitive.',[{label:'Supprimer mon compte',act:'deleteMeGo',danger:true}]);break;
   case 'deleteMeGo':{if(needNet())break;{const paths=notes().flatMap(n=>(n.media||[]).map(m=>m.path)).filter(Boolean);if(paths.length)try{await sb.storage.from(BRAIN_BUCKET).remove(paths)}catch(e){}}const r=await sb.rpc('delete_me');if(r.error){hud('Erreur : '+r.error.message);break}
     try{await sb.auth.signOut()}catch(e){}
     A.user=null;A.group=null;A.members=[];A.shares=[];A.dirty=false;clearTimeout(A.t);delete db.owner;writeLocal();try{localStorage.setItem(AK,'local')}catch(e){}
     refreshView();paintFriends();hud('Compte supprimé');break}
  }});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset?.rd==null)return;const s=st();s.reading=s.reading||{on:false,label:'Lecture',min:10};const k=t.dataset.rd;
  if(k==='on')s.reading.on=t.checked;else if(k==='min'){s.reading.min=Math.max(1,Math.round(num(t.value)||10));t.value=s.reading.min}else s.reading.label=t.value.trim()||'Lecture';save()});
document.addEventListener('submit',async ev=>{const f=ev.target;const k=f.dataset?.form;if(!['auth','onboard','gcreate','gjoin'].includes(k))return;ev.preventDefault();
  if(k==='auth')return doAuth(f);
  if(k==='onboard')return doOnboard(f);
  if(needNet())return;const btn=document.querySelector('.sheet-h .strong');if(btn)btn.disabled=true;
  try{
    if(k==='gcreate'){await groupCreate(String(new FormData(f).get('name')||'').trim());closeSheet();await loadGroup(true);refreshView();hud('Groupe créé · code '+A.group?.code)}
    if(k==='gjoin'){const code=String(new FormData(f).get('code')||'').trim().toUpperCase();if(code.length!==6){hud('Le code fait 6 caractères');if(btn)btn.disabled=false;return}
      const r=await sb.rpc('join_group',{invite:code});if(r.error)throw r.error;closeSheet();await loadGroup(true);refreshView();hud('Bienvenue dans « '+(A.group?.name||'le groupe')+' »')}
  }catch(e){if(btn)btn.disabled=false;hud(/invalide/i.test(e?.message||'')?'Code invalide':'Erreur : '+(e?.message||e))}});
render();keepAwake();showHome(false);cloudBoot();
(function(){const first=$('#splash');if(!first)return;const HTML=first.outerHTML;let hiddenAt=0;
  function play(sp){const short=reduce();if(short)sp.classList.add('short');let done=false;
    const end=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.remove(),420)};
    sp.addEventListener('click',end);setTimeout(end,short?500:4600)}
  play(first);
  /* L'animation se joue à l'ouverture de l'app. Après un simple passage dans une autre app, elle ne se rejoue que si l'absence a duré au moins 30 min.
     Jamais pendant une séance ni une lecture chronométrée. */
  const AWAY=30*60e3;
  const replay=()=>{if(!hiddenAt||Date.now()-hiddenAt<AWAY||db.active||db.reading||$('#splash'))return;document.body.insertAdjacentHTML('afterbegin',HTML);play($('#splash'))};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}replay()});
  window.addEventListener('pageshow',e=>{if(e.persisted)replay()});
})();
})();
</script>
